/* Shared layout: keep content readable and actions in view at every viewport. */
html { scrollbar-gutter: stable; }
body.modal-open { overflow: hidden; }
[hidden] { display: none !important; }
input, select, textarea, .row > *, .columns > *, .room-grid > *, .grid2 > * { min-width: 0; }
button, .pill, .notice, .foot, .context, .detail, .member, .profile-bio, .profile-interests { overflow-wrap: anywhere; }
h1, h2, h3, .member-list, .score-card { overflow-wrap: anywhere; }
input[type="checkbox"] { flex: 0 0 16px; width: 16px; height: 16px; margin: 3px 0; accent-color: var(--accent); }
.check { align-items: flex-start; line-height: 1.5; }
.composer input { flex: 1; width: 0; }
.composer button, .member .avatar { flex-shrink: 0; }
.toolbar .tabs { min-width: 0; }
.toolbar .search { flex: 1 1 180px; width: auto; }
.account-nav { justify-content: flex-end; flex-wrap: nowrap; }
.account-button { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .brand { flex-shrink: 0; white-space: nowrap; }
.member > div { min-width: 0; }
.score-row { flex-wrap: wrap; }
.score-row meter { min-width: 80px; }
#ai-result { white-space: normal; padding: 4px 6px 14px 0; scroll-padding-block: 12px; }
.messages { scroll-padding-block: 16px; overscroll-behavior: contain; }
.tile-top { gap: 8px; }
.tile-top > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-timer { flex-shrink: 0; }
.identity { width: 100%; min-width: 0; padding: 34px 10px 48px; }
.identity p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-stage .identity .avatar { margin-bottom: 6px; }
.controls { gap: 8px; padding: 16px 0; }
.entry-pod { margin-block: 24px; }
.entry-pod .waiting-fact { margin-top: 0; }
.waiting-fact { overflow-wrap: anywhere; }

/* Native dialog provides focus trapping, Escape and a true modal backdrop. */
dialog {
  width: min(560px, calc(100vw - 48px));
  max-width: none;
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - 48px);
  padding: 0;
  overflow: hidden;
  box-shadow: 0 24px 100px #0009;
}
dialog.dialog-wide { width: min(840px, calc(100vw - 48px)); }
.dialog-form { display: flex; flex-direction: column; max-height: calc(100vh - 50px); max-height: calc(100dvh - 50px); min-height: 0; }
.dialog-header { flex: none; display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 16px 20px 16px 24px; border-bottom: 1px solid var(--line); }
.dialog-header h2 { margin: 0; font-size: 21px; line-height: 1.35; letter-spacing: -.4px; }
.dialog-close { flex: 0 0 36px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; font-size: 25px; line-height: 1; background: transparent; border-color: transparent; }
.dialog-scroll-frame { display: flex; min-height: 0; padding-block: 8px; overflow: hidden; }
.dialog-body { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 8px 24px 12px; scroll-padding-block: 20px; overscroll-behavior: contain; scrollbar-gutter: stable; overflow-wrap: anywhere; }
.dialog-footer { flex: none; padding: 14px 24px; border-top: 1px solid var(--line); background: #16191b; }
.dialog-actions { margin: 0; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.dialog-error { margin: 0 0 12px; line-height: 1.5; max-height: 6em; overflow: auto; overflow-wrap: anywhere; }
.dialog-error:empty { display: none; }
.dialog-body label { font-size: 13px; margin: 10px 0 0; }
.dialog-body label > input:not([type="checkbox"]), .dialog-body label > select, .dialog-body label > textarea { display: block; margin-top: 5px; }
.dialog-body label small { display: block; margin-top: 4px; }
.dialog-body input, .dialog-body select, .dialog-body textarea { padding: 8px 10px; font-size: 14px; line-height: 1.4; }
.dialog-body input[type="file"] { width: 100%; font-size: 12px; }
.dialog-body input[type="file"]::file-selector-button { margin-right: 8px; border: 0; border-radius: 3px; padding: 4px 6px; background: #303638; color: #f3f4f4; }
.dialog-body textarea { min-height: 80px; }
.dialog-body .check { margin-block: 12px; }
.dialog-body .foot, .field-help { margin-top: 12px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.dialog-body > :first-child { margin-top: 0; }
.dialog-body .grid2 { gap: 8px 18px; }
.settings-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 24px; }
.settings-section { min-width: 0; }
.settings-section + .settings-section { border-left: 1px solid var(--line); padding-left: 24px; }
.settings-section h3 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.settings-section textarea { height: 82px; }
.settings-section .notification-button { width: 100%; font-size: 13px; margin-top: 2px; }
.settings-tools { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 16px; margin-top: 10px; border-top: 1px solid var(--line); }
.settings-tools > button { padding: 7px 11px; font-size: 12px; }
.settings-tools .import-control { margin: 0; max-width: 240px; }
.profile-heading { display: flex; align-items: center; gap: 14px; padding-block: 2px 10px; }
.profile-heading .avatar { width: 52px; height: 52px; flex-shrink: 0; }
.profile-bio { white-space: pre-wrap; margin: 8px 0 12px; }
.profile-interests { margin: 10px 0 18px; }
.dialog-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; padding-bottom: 8px; }
.dialog-tabs button { padding: 7px 14px; background: transparent; border-color: transparent; color: var(--muted); }
.dialog-tabs button[aria-selected="true"] { color: var(--accent); background: #25301b; border-color: #3b4a29; }
[role="tabpanel"] { min-width: 0; }
.field-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
.field-heading label { margin: 0; }
.field-heading button { padding: 4px 8px; font-size: 12px; }
.draft-writing { margin-top: 10px; }
.draft-writing textarea { height: 156px; min-height: 110px; }
.access-options { margin-top: 12px; }

@media (max-width: 760px) {
  .topbar { height: auto; min-height: 76px; padding-block: 12px; flex-wrap: wrap; gap: 10px; }
  .topbar .brand { font-size: 18px; gap: 8px; }
  .topbar .brand .pill { display: none; }
  .account-nav { margin-left: auto; gap: 6px; }
  .account-button { max-width: 140px; }
  .toolbar { gap: 10px; }
  .toolbar .search { flex-basis: 100%; max-width: none; }
  .debate-row { grid-template-columns: minmax(0,1fr) 102px; }
  .debate-row .meta { grid-column: 1 / -1; }
  .roundbar .timer { font-size: 28px; }
  .room-grid { gap: 16px; }
  .pod { padding: 16px; }
}
@media (max-width: 600px) {
  dialog, dialog.dialog-wide { width: 100%; height: 100vh; height: 100dvh; max-height: none; margin: 0; border: 0; border-radius: 0; }
  .dialog-form { height: 100%; max-height: 100%; }
  .dialog-header { padding: calc(10px + env(safe-area-inset-top)) 12px 10px 18px; }
  .dialog-header h2 { font-size: 20px; }
  .dialog-close { width: 44px; height: 44px; flex-basis: 44px; }
  .dialog-scroll-frame { flex: 1; padding-block: 8px; }
  .dialog-body { padding: 8px 18px 16px; scrollbar-gutter: auto; }
  .dialog-body input, .dialog-body textarea, .dialog-body select { font-size: 16px; }
  .dialog-footer { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); }
  .dialog-footer button { min-height: 44px; }
  .settings-grid { grid-template-columns: minmax(0,1fr); gap: 20px; }
  .settings-section + .settings-section { border-left: 0; padding: 18px 0 0; border-top: 1px solid var(--line); }
  .dialog-body .grid2 { grid-template-columns: minmax(0,1fr); }
  .dialog-tabs { gap: 4px; }
  .dialog-tabs button { min-height: 42px; flex: 1; padding-inline: 8px; }
  .settings-tools > button { min-height: 40px; }
  .draft-writing textarea { height: 128px; }
  .toast { bottom: calc(16px + env(safe-area-inset-bottom)); width: max-content; }
  .identity { padding: 30px 8px 40px; }
}
@media (max-width: 380px) {
  .account-nav { width: 100%; justify-content: flex-end; }
  .account-button { max-width: 200px; }
  .v2-stage .identity .avatar { width: 38px; height: 38px; font-size: 17px; }
  .v2-stage .identity p { font-size: 12px; }
}
@media (min-width:601px){.dialog-wide [role="tabpanel"]{min-height:358px}}

pic">Edit topic & format ✦</button>':''}</div><div id="room-agreement"></div><div class="row" style="margin-top:12px">${role!=='viewer'?'<button id="ready-btn" onclick="v2Ready()">Ready</button><button id="start-btn" class="primary" onclick="v2Start()">Start debate</button>':''}</div></div><details class="pod" open><summary><b>Everyone in the room</b> <span id="member-count"></span></summary><div id="member-list" class="member-list"></div><small>Up to eight camera tiles are displayed. Hidden and off-screen participants stay in the room.</small></details><section class="chat" id="v2-chat"><div class="chat-head"><h3>Room chat</h3><small>Debaters cannot read or send chat during the debate.</small></div><div class="messages" id="v2-chat-messages"></div><form class="composer" onsubmit="v2RoomChatSend(event)"><input name="message" maxlength="1000" required aria-label="Room chat message"><button>Send ↗</button></form></section></section><aside>${role!=='viewer'?'<div class="pod"><h3>Your lifelines</h3><button class="lifeline" id="v2-interrupt" onpointerdown="v2Hold(event)" onpointerup="v2Release()" onpointercancel="v2Release()">✋ Hold space · <span id="v2-interrupt-time">02:00</span></button><button class="lifeline" id="v2-definition" onclick="v2Definition()">▤ Definition · <span id="v2-definition-count">3</span></button><button class="lifeline" id="v2-source" onclick="v2Source()">⌕ Clarify source · <span id="v2-source-count">1</span></button></div>':''}<div class="pod"><h3>Separate audio tracks</h3><p class="muted" id="capture-note">Every debater’s own audio is captured separately when the debate starts.</p><div id="audio-clips"></div><button id="video-record-btn" onclick="v2ToggleVideo()" style="margin-top:12px">Record my camera locally</button><div id="video-download"></div><button onclick="v2DownloadManifest()" style="margin-top:12px">Download timing manifest</button><p class="foot">Private audio uploads are attributed to the signed-in speaker. Clock alignment is estimated; the manifest includes timing uncertainty.</p></div><div class="pod"><h3>AI review</h3><p class="muted">${RoomRules.modeOf(room)==='open'?'Ranks individual arguments with reasons.':RoomRules.modeOf(room)==='teams'?'Compares the PRO and CON cases, rebuttals, and topic consistency.':'Compares both debaters’ arguments and rebuttals.'}</p><button id="review-btn" onclick="v2Review()" style="margin-top:12px">Review available transcript</button><div id="audience-voting"></div><div id="ai-result"></div><button disabled title="Admin appeals are not available yet" style="margin-top:12px">⚑ Appeal decision · coming soon</button><p class="foot">Requires the deployed AI function. No result is invented when analysis is unavailable.</p></div></aside></div>`;mountWaitingFact();v2RenderState();renderAudienceVoting()}
function v2RenderState(){if(!roomJoined||!$('#camera-stage'))return;const s=roomV2.session,m=currentMember(),r=v2Round();$('#lobby-fact')?.classList.toggle('hidden',s.phase!=='lobby');$('#room-title').textContent=room.title;$('#room-context').textContent=room.context;$('#all-subtopics').innerHTML=(room.subs||[]).map(x=>`<div class="subtopic"><b>${esc(x.title)}</b><p>${esc(x.context)}</p></div>`).join('');$('#phase-caption').textContent=s.phase==='active'?(r?.speaker==='all'?'Open floor':roomV2.members.find(m=>m.user_id===r?.speaker)?.alias||'Starting shortly'):s.phase==='ended'?'Debate complete':'Waiting room';$('#round-label').textContent=r?.label||(s.phase==='ended'?'Save your recordings':'Review the topic together');$('#active-subcontext').textContent=r?.context||'';$('#topic-progress').innerHTML=(room.subs||[]).map((x,i)=>`<span class="pill ${r?.topicIndex===i?'live':''}">${i+1}. ${esc(x.title)}</span>`).join('');$('#member-count').textContent=' · '+roomV2.members.length;$('#member-list').innerHTML=roomV2.members.map(p=>`<div class="row"><span>${esc(p.alias)}</span><small>${esc(p.role)}${p.user_id===room.host?' · creator':''}${p.hidden?' · hidden':''}${s.ready?.[p.user_id]?' · ready':''}</small></div>`).join('');
 if(role!=='viewer'){$('#edit-topic').disabled=s.phase!=='lobby';$('#ready-btn').disabled=s.phase!=='lobby'||!m?.media_ready||!!s.proposal;$('#ready-btn').textContent=s.ready?.[identity()]?'Ready ✓':'Ready';$('#start-btn').disabled=!(s.phase==='lobby'||s.phase==='ended'&&room.ongoing)||!!s.proposal||!!room.host&&room.host!==identity();$('#start-btn').textContent=s.phase==='ended'&&room.ongoing?'Reopen waiting room':room.first==='random'?'Flip coin & start':'Start debate'}
 const proposal=s.proposal;$('#room-agreement').innerHTML=proposal?`<div class="notice"><b>Proposed topic: ${esc(proposal.draft.title)}</b><p class="context">${esc(proposal.draft.context)}</p>${proposal.draft.subs.map(x=>`<p>${esc(x.title)} — ${esc(x.context)}</p>`).join('')}<p>Intro ${esc(proposal.draft.intro)} · Framing ${esc(proposal.draft.framing)} · Closing ${esc(proposal.draft.closing)}</p>${role!=='viewer'&&proposal.by!==identity()?'<button onclick="v2Approve(true)">Approve</button> <button onclick="v2Approve(false)">Reject</button>':''}<small>All current debaters must approve.</small></div>`:`<p class="muted">${RoomRules.modeOf(room)==='duel'?'Both debaters':'All debaters'} must enable audio and approve the format by marking Ready.</p>`;
 $('#v2-chat').classList.toggle('hidden',s.phase==='active'&&role!=='viewer');$('#hide-btn').disabled=s.phase==='active'&&role!=='viewer';$('#hide-btn').textContent=m?.hidden?'◉ Show my tile':'◉ Hide my tile';$('#camera-btn').textContent=cameraOff?'Camera on':'Camera off';
 if(roomV2.lastPhase==='lobby'&&s.phase==='active'){roomV2.visible=[];v2Status('Debate starts on the shared clock. Hidden debaters are restored.')}roomV2.lastPhase=s.phase;
 renderAudienceVoting();v2Tiles();v2Tick();
}
function v2Tiles(){const next=RoomRules.selectTiles(roomV2.members,roomV2.activity,roomV2.visible,room,roomV2.session,roomNow());const stage=$('#camera-stage');stage.classList.toggle('duel-view',RoomRules.modeOf(room)==='duel'&&roomV2.session.phase!=='lobby');const signature=next.map(id=>{const p=roomV2.members.find(m=>m.user_id===id);return id+':'+p.alias+':'+p.camera_on}).join('|');roomV2.visible=next;if(signature!==roomV2.signature){roomV2.signature=signature;stage.replaceChildren();for(let id of next){const p=roomV2.members.find(m=>m.user_id===id),tile=document.createElement('section');tile.className='seat';tile.dataset.user=id;tile.innerHTML=`<div class="tile-top"><span>${esc(p.role)}${p.user_id===room.host?' · creator':''}</span><span class="tile-timer">--:--</span></div><div class="identity">${avatar(p)}<p>${esc(p.alias)}</p></div><video autoplay muted playsinline></video><span class="nameplate">${esc(p.alias)}${id===identity()?' · You':''}</span>${v2MicBadge()}`;const video=tile.querySelector('video');video.srcObject=roomV2.streams.get(id)||null;video.classList.toggle('hidden',!p.camera_on||!video.srcObject);stage.append(tile)}}
 for(let tile of stage.children){const id=tile.dataset.user,video=tile.querySelector('video'),stream=roomV2.streams.get(id);if(stream&&video.srcObject!==stream)video.srcObject=stream;tile.classList.toggle('speaking',!!roomV2.activity[id]?.speaking);video.classList.toggle('hidden',!roomV2.members.find(m=>m.user_id===id)?.camera_on||!stream)}v2UpdateMicBadges();
}
function v2Tick(){if(!roomJoined||!$('#round-time'))return;const now=roomNow(),s=roomV2.session,r=v2Round(),m=currentMember();$('#round-time').textContent=r?minutes(Math.ceil((r.endsAt-now)/1000)):s.phase==='ended'?'00:00':s.startedAt>now?minutes(Math.ceil((s.startedAt-now)/1000)):'--:--';for(let tile of $('#camera-stage').children){const person=roomV2.members.find(m=>m.user_id===tile.dataset.user);tile.querySelector('.tile-timer').textContent=RoomRules.maySpeak(person,room,s,now)&&r?minutes(Math.ceil((r.endsAt-now)/1000)):'Listening'}
 if(role!=='viewer'){const budget={interruptMs:120000,definitions:3,source:1,...s.budgets?.[identity()]};const remaining=budget.interruptMs+(s.interrupt?.user_id===identity()?Math.max(0,s.interrupt.endsAt-now):0);$('#v2-interrupt-time').textContent=minutes(remaining/1000);$('#v2-interrupt').disabled=!roomV2.hold&&!RoomRules.canInterrupt(m,room,s,now);$('#v2-definition-count').textContent=budget.definitions;$('#v2-source-count').textContent=budget.source;$('#v2-definition').disabled=s.phase!=='active'||!budget.definitions;$('#v2-source').disabled=s.phase!=='active'||!budget.source}
 v2ApplyMic();if((s.phase==='ended'||s.endsAt&&now>=s.endsAt)&&roomV2.videoRecorder?.state==='recording')v2ToggleVideo();if(s.phase==='active'&&now>=s.startedAt&&now<s.endsAt&&role!=='viewer'&&roomV2.outgoing&&!roomV2.recording&&!roomV2.stopCapture)v2StartCapture();if((s.phase==='ended'||s.endsAt&&now>=s.endsAt)&&roomV2.recording)v2StopCapture();}
function v2ApplyMic(){const allowed=roomJoined&&RoomRules.maySpeak(currentMember(),room,roomV2.session,roomNow())&&!manualMute;roomV2.outgoing?.getAudioTracks().forEach(t=>t.enabled=allowed);if($('#mic-btn'))$('#mic-btn').textContent=!RoomRules.maySpeak(currentMember(),room,roomV2.session,roomNow())?'🔒 Mic locked':manualMute?'Unmute mic':'Mute mic';v2UpdateMicBadges();v2ShareMic()}
async function v2EnableMedia(){if(roomV2.raw)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Use HTTPS or localhost for media.');try{roomV2.raw=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:true})}catch(e){if(e.name==='NotAllowedError')throw e;roomV2.raw=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}roomV2.outgoing=new MediaStream(roomV2.raw.getTracks().map(t=>t.clone()));localStream=roomV2.outgoing;cameraOff=!roomV2.outgoing.getVideoTracks().length;roomV2.streams.set(identity(),roomV2.outgoing);roomV2.audioContext||=new AudioContext();await roomV2.audioContext.resume();v2AddAnalyser(identity(),roomV2.raw);v2ApplyMic();await v2Action('media',{media_ready:true,camera_on:!cameraOff});$('#enable-media').disabled=true;v2ConnectRoster(true)}catch(e){toast('Media unavailable: '+e.message)}}
function v2ToggleMic(){manualMute=!manualMute;roomV2.raw?.getAudioTracks().forEach(t=>t.enabled=!manualMute);v2ApplyMic()}
async function v2ToggleCamera(){if(!roomV2.outgoing)return toast('Enable media first.');cameraOff=!cameraOff;roomV2.outgoing.getVideoTracks().forEach(t=>t.enabled=!cameraOff);try{await v2Action('media',{media_ready:true,camera_on:!cameraOff&&!!roomV2.outgoing.getVideoTracks().length})}catch(e){toast(cloudError(e))}}
async function v2Hide(){try{await v2Action('hide',{hidden:!currentMember()?.hidden})}catch(e){toast(cloudError(e))}}
async function v2Ready(){try{await v2Action('ready')}catch(e){toast(cloudError(e))}}
async function v2Start(){try{await v2Action(roomV2.session.phase==='ended'&&room.ongoing?'restart':'start')}catch(e){toast(cloudError(e))}}
function v2Propose(){if(role==='viewer'||roomV2.session.phase!=='lobby')return;modal('Propose topic & format',draftFields(room),async(f,el)=>{const draft={...parseDraft(f),mode:room.mode};RoomRules.validateFormat(draft);await v2Action('propose',{draft});el.close()},'Send for approval',{wide:true})}
async function v2Approve(approve){try{await v2Action('approve',{approve});await v2Poll()}catch(e){toast(cloudError(e))}}
async function v2Hold(e){if(e?.pointerId)e.currentTarget.setPointerCapture(e.pointerId);if(roomV2.hold||!RoomRules.canInterrupt(currentMember(),room,roomV2.session,roomNow()))return;roomV2.hold=true;try{await v2Action('interrupt_start');if(!roomV2.hold)await v2Action('interrupt_end')}catch(err){roomV2.hold=false;toast(cloudError(err))}}
async function v2Release(){if(!roomV2.hold)return;roomV2.hold=false;try{await v2Action('interrupt_end')}catch(e){toast(cloudError(e))}}
function v2Definition(){modal('Definition','<label>Term<input name="term" required></label><p class="foot">Local glossary: evidence, bias, causation, correlation, externality, falsifiability.</p>',async(f,el)=>{const term=f.get('term').trim().toLowerCase();if(!dictionary[term])throw Error('Not in the local glossary. No lifeline spent.');await v2Action('definition');el.close();modal(esc(term),'<p>'+esc(dictionary[term])+'</p>',null)},'Use lifeline')}
function v2Source(){modal('Clarify a source','<label>Source and question<textarea name="source" required maxlength="1000"></textarea></label><p class="foot">This sends your question to the configured AI review endpoint.</p>',async(f,el)=>{const {data,error}=await cloudClient.functions.invoke('debate-ai',{body:{action:'source',debateId:roomId,question:f.get('source'),tabId}});if(error)throw Error('AI service unavailable. No lifeline spent.');await v2Poll();el.close();modal('Source clarification','<p class="context">'+esc(data.answer)+'</p><p class="foot">Review the original source; this is not independent verification.</p>',null)},'Use lifeline')}
function v2InitPeer(){if(typeof Peer==='undefined')return v2Status('PeerJS did not load. Reload to enable calls.');roomV2.peer=new Peer('of2-'+tabId);roomV2.peer.on('open',()=>{v2Status('Media signaling connected. Enable your microphone to participate.');v2ConnectRoster()});roomV2.peer.on('call',call=>{const member=roomV2.members.find(m=>'of2-'+m.tab_id===call.peer);if(!member){call.close();return}call.answer(roomV2.outgoing||undefined);v2WireCall(member,call)});roomV2.peer.on('connection',c=>{const member=roomV2.members.find(m=>'of2-'+m.tab_id===c.peer);if(!member){c.close();return}v2WireData(member,c)});roomV2.peer.on('error',e=>v2Status('Media signaling: '+e.message));}
function v2ConnectRoster(force=false){if(!roomV2.peer?.open)return;const peers=new Map(roomV2.members.map(m=>[m.user_id,'of2-'+m.tab_id]));for(let [id,c] of roomV2.connections)if(peers.get(id)!==c.peer){roomV2.connections.delete(id);c.close();delete roomV2.micStates[id];delete roomV2.activity[id]}for(let [id,c] of roomV2.calls)if(peers.get(id)!==c.peer){roomV2.calls.delete(id);c.close();roomV2.streams.delete(id);roomV2.analysers.delete(id);$('#remote-audio audio[data-user="'+id+'"]')?.remove()}for(let p of roomV2.members){if(p.user_id===identity())continue;if(!roomV2.connections.get(p.user_id)&&tabId<p.tab_id){v2WireData(p,roomV2.peer.connect('of2-'+p.tab_id,{reliable:true}))}if(roomV2.outgoing&&(force||!roomV2.calls.has(p.user_id))&&(tabId<p.tab_id||!p.media_ready||force)){const call=roomV2.peer.call('of2-'+p.tab_id,roomV2.outgoing);if(call)v2WireCall(p,call)}}}
function v2WireCall(member,call){const old=roomV2.calls.get(member.user_id);roomV2.calls.set(member.user_id,call);if(old&&old!==call)old.close();call.on('stream',stream=>{if(!roomJoined||roomV2.calls.get(member.user_id)!==call||!roomV2.members.some(m=>m.user_id===member.user_id&&'of2-'+m.tab_id===call.peer))return;roomV2.streams.set(member.user_id,stream);let audio=$('#remote-audio audio[data-user="'+member.user_id+'"]');if(!audio){audio=document.createElement('audio');audio.dataset.user=member.user_id;audio.autoplay=true;$('#remote-audio').append(audio)}audio.srcObject=stream;audio.play().catch(()=>{v2Status('Browser blocked audio. Click Enable room audio.');if(!$('#play-audio')){let b=document.createElement('button');b.id='play-audio';b.textContent='Enable room audio';b.onclick=()=>{$$('#remote-audio audio').forEach(a=>a.play().catch(()=>{}));roomV2.audioContext?.resume();b.remove()};$('#connection-status').after(b)}});v2AddAnalyser(member.user_id,stream);v2Tiles()});call.on('close',()=>{if(roomV2.calls.get(member.user_id)===call){roomV2.calls.delete(member.user_id);roomV2.streams.delete(member.user_id)}});call.on('error',()=>{if(roomV2.calls.get(member.user_id)===call)roomV2.calls.delete(member.user_id)})}
function v2WireData(member,c){const old=roomV2.connections.get(member.user_id);roomV2.connections.set(member.user_id,c);if(old&&old!==c)old.close();c.on('open',()=>v2ShareMic(true));c.on('data',d=>{if(!roomJoined||roomV2.connections.get(member.user_id)!==c||!roomV2.members.some(m=>m.user_id===member.user_id&&'of2-'+m.tab_id===c.peer))return;if(d?.type==='mic'&&typeof d.muted==='boolean'){roomV2.micStates[member.user_id]=d.muted;v2UpdateMicBadges();return}if(d?.type==='activity'&&typeof d.speaking==='boolean'){const a=roomV2.activity[member.user_id]||{totalMs:0};if(d.speaking)a.lastSpoke=roomNow();a.speaking=d.speaking;roomV2.activity[member.user_id]=a}});c.on('close',()=>{if(roomV2.connections.get(member.user_id)===c){roomV2.connections.delete(member.user_id);delete roomV2.micStates[member.user_id]}});c.on('error',()=>{if(roomV2.connections.get(member.user_id)===c)roomV2.connections.delete(member.user_id)})}
function v2AddAnalyser(id,stream){if(!stream.getAudioTracks().length)return;try{roomV2.audioContext||=new AudioContext();const source=roomV2.audioContext.createMediaStreamSource(stream),analyser=roomV2.audioContext.createAnalyser();analyser.fftSize=1024;source.connect(analyser);roomV2.analysers.set(id,{source,analyser,samples:new Uint8Array(1024),last:performance.now(),active:false})}catch(e){v2Status('Speaker detection unavailable: '+e.message)}}
function v2Analyse(){if(!roomJoined)return;for(let [id,a] of roomV2.analysers){a.analyser.getByteTimeDomainData(a.samples);const rms=Math.sqrt(a.samples.reduce((sum,n)=>sum+((n-128)/128)**2,0)/a.samples.length),detected=rms>.025,now=performance.now();if(detected)a.lastDetected=now;const speaking=detected||now-(a.lastDetected||0)<450,audibleHere=id!==identity()||RoomRules.maySpeak(currentMember(),room,roomV2.session,roomNow())&&!manualMute;let activity=roomV2.activity[id]||{totalMs:0};if(speaking&&audibleHere){activity.totalMs+=Math.min(300,now-a.last);activity.lastSpoke=roomNow()}activity.speaking=speaking&&audibleHere;roomV2.activity[id]=activity;a.last=now;if(id===identity()&&a.active!==speaking){a.active=speaking;const audible=RoomRules.maySpeak(currentMember(),room,roomV2.session,roomNow())&&!manualMute;for(let c of roomV2.connections.values())if(c.open)c.send({type:'activity',speaking:speaking&&audible});v2Action('speech',{speaking,audible,clientEstimatedAt:roomNow(),uncertaintyMs:roomV2.uncertainty,classification:audible?'client-reported-audible':'muted-attempt-not-a-violation'}).catch(()=>{})}}v2Tiles()}

const waitingFacts=[
 {text:'Parliamentary debate borrows its format from debates in a legislature.',source:'Wikipedia · Parliamentary debate',url:'https://en.wikipedia.org/wiki/Parliamentary_debate'},
 {text:'An octopus has three hearts: two pump blood through the gills, and one supplies the rest of its body.',source:'Wikipedia · Octopus',url:'https://en.wikipedia.org/wiki/Octopus'},
 {text:'Turning your camera off keeps you in the tile rotation. Hide my tile removes your tile while you stay in the room.',source:'Openfloor · How this room works'},
 {text:'In a 1v1 debate, the lightning round lets both debaters speak without spending their interruption time.',source:'Openfloor · Debate format'}
];
const waitingFactKey='openfloor.daily-fact.wikipedia.v1';
let waitingFactRequest=null,waitingFactDate='',waitingFactCached=null;
function safeFact(value){
 if(!value||typeof value.text!=='string'||!value.text.trim()||value.text.length>600)return null;
 try{const url=new URL(value.url);if(url.origin!=='https://en.wikipedia.org'||url.username||url.password||!url.pathname.startsWith('/wiki/'))return null;
 return {text:value.text.trim(),source:'Wikipedia · On this day',url:url.href,license:true}}catch{return null}
}
function wikipediaDailyFact(data,date=new Date()){
 const events=Array.isArray(data?.events)?data.events.filter(e=>Number.isInteger(e.year)&&e.year>=-5000&&e.year<=date.getUTCFullYear()&&typeof e.text==='string'&&e.text.trim()&&e.text.length<=550):[];
 const event=events.find(e=>/discover|invent|spacecraft|telescope|astronom|circumnavig|museum|patent|railway|science|computer|music|planet|opera|publish|radio|television/i.test(e.text)&&!/killed|crash|massacre|war|murder|attack|death|died|bomb/i.test(e.text))||events[0];
 if(!event)return null;
 const month=['January','February','March','April','May','June','July','August','September','October','November','December'][date.getUTCMonth()];
 return safeFact({text:'On this day in '+(event.year<0?Math.abs(event.year)+' BC':event.year)+': '+event.text,url:'https://en.wikipedia.org/wiki/'+month+'_'+date.getUTCDate()});
}
async function dailyWaitingFact(){
 const day=new Date().toISOString().slice(0,10);
 if(waitingFactDate===day&&(waitingFactCached||waitingFactRequest))return waitingFactCached||waitingFactRequest;
 waitingFactDate=day;waitingFactCached=null;
 try{const saved=JSON.parse(localStorage.getItem(waitingFactKey)||'null');if(saved?.day===day&&safeFact(saved.fact))return waitingFactCached=safeFact(saved.fact)}catch{}
 const job=(async()=>{
  const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),4000);
  try{
   const response=await fetch('https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/'+day.slice(5,7)+'/'+day.slice(8,10),{headers:{Accept:'application/json'},credentials:'omit',referrerPolicy:'no-referrer',signal:abort.signal});
   if(!response.ok)throw Error('Fact unavailable');
   const fact=wikipediaDailyFact(await response.json(),new Date(day+'T00:00:00Z'));if(!fact)return null;
   if(waitingFactDate===day)waitingFactCached=fact;
   try{localStorage.setItem(waitingFactKey,JSON.stringify({day,fact}))}catch{}
   return fact;
  }catch{return null}finally{clearTimeout(timeout)}
 })();
 // Keep the settled promise for this day so a failing provider is not polled repeatedly.
 waitingFactRequest=job;return job;
}
function waitingFactMarkup(){return '<aside class="waiting-fact" id="waiting-fact" aria-label="Waiting room fun fact"><div class="row between"><span class="eyebrow">✦ While you wait</span><button type="button" class="ghost" id="next-waiting-fact">Another fact ↻</button></div><p id="waiting-fact-text"></p><small id="waiting-fact-source"></small></aside>'}
function showWaitingFact(fact){
 const text=$('#waiting-fact-text'),source=$('#waiting-fact-source');if(!text||!source)return;
 text.textContent=fact.text;source.replaceChildren();
 if(fact.url){const link=document.createElement('a');link.textContent=fact.source;link.href=fact.url;link.target='_blank';link.rel='noopener noreferrer';source.append(link);if(fact.license){const license=document.createElement('a');license.textContent=' · CC BY-SA 4.0';license.href='https://creativecommons.org/licenses/by-sa/4.0/';license.target='_blank';license.rel='noopener noreferrer';source.append(license)}}else source.textContent=fact.source;
}
function mountWaitingFact(peopleInRoom){
 const card=$('#waiting-fact');if(!card)return;
 const facts=[...waitingFacts];
 if(Number.isInteger(peopleInRoom)&&peopleInRoom>=0)facts.unshift({text:peopleInRoom===0?'You can be the first person in this waiting room.':`${peopleInRoom} ${peopleInRoom===1?'person is':'people are'} in this room right now.`,source:'Openfloor · Live room count when loaded'});

}

function v2MicState(member){

/* Shared-data adapter. Supabase owns accounts and persisted writes; browser storage is never an offline write fallback. */
let cloudClient=null,cloudSession=null,cloudReady=false,cloudGeneration=0,cloudRoomHeartbeat=null,cloudSubscription=null,cloudRefreshBusy=false;
const CLOUD_AUTH_KEY='openfloor.supabase.auth';
function cloudAuthOptions(){
 // Upgrade tab-only sessions once. Never resurrect an old tab after shared sign-out.
 const marker=CLOUD_AUTH_KEY+'.shared-v1';
 if(!localStorage.getItem(marker)){
  const legacy=sessionStorage.getItem(CLOUD_AUTH_KEY);
  if(!localStorage.getItem(CLOUD_AUTH_KEY)&&legacy){try{const parsed=JSON.parse(legacy);if(typeof parsed.access_token==='string'&&typeof parsed.refresh_token==='string'&&parsed.user?.id)localStorage.setItem(CLOUD_AUTH_KEY,legacy)}catch{}}
  localStorage.setItem(marker,'1');
 }
 sessionStorage.removeItem(CLOUD_AUTH_KEY);
 return {storage:localStorage,storageKey:CLOUD_AUTH_KEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true};
}
async function cloudAuthChanged(event,session){
 if(event==='INITIAL_SESSION')return;
 if((event==='TOKEN_REFRESHED'||event==='SIGNED_IN')&&cloudSession?.user?.id===session?.user?.id){cloudSession=session;return}
 await cloudAcceptSession(session);
 if(event==='PASSWORD_RECOVERY')cloudRecovery();
}
function cloudError(error){const text=error?.message||String(error);if(/PGRST205|schema cache|does not exist/.test(text))return 'Database setup is pending. Run supabase/001_shared.sql in the Supabase SQL Editor, then reload.';return text}
function cloudBanner(message,error=false){let el=$('#cloud-status');if(!el){el=document.createElement('div');el.id='cloud-status';el.className='notice';el.style.margin='12px 4%';document.querySelector('header').after(el)}el.textContent=message;el.style.borderColor=error?'#784343':''}
async function cloudResult(request){const {data,error}=await request;if(error)throw Error(cloudError(error));return data}
function cloudDebate(row){return {...row.payload,id:row.id,host:row.host,privacy:row.privacy,password:''}}
function cloudSignedIn(){if(!cloudReady){toast('The shared database is not connected yet. See the connection notice.');return false}if(!cloudSession){auth(false);return false}return true}
async function cloudRefresh(render=false){if(cloudRefreshBusy&&!render)return;const generation=cloudGeneration;cloudRefreshBusy=true;try{
 const user=cloudSession?.user;
 const [debates,profiles,subscriptions,prefs]=await Promise.all([
  cloudResult(cloudClient.from('debates').select('*').order('created_at',{ascending:false}).limit(200)),
  user?cloudResult(cloudClient.from('profiles').select('*').order('created_at').limit(200)):[],
  user?cloudResult(cloudClient.from('subscriptions').select('*').eq('user_id',user.id)):[],
  user?cloudResult(cloudClient.from('preferences').select('*').eq('user_id',user.id)):[]
 ]);
 if(generation!==cloudGeneration)return;
 if(user&&!profiles.some(p=>p.id===user.id)){const own=await cloudResult(cloudClient.from('profiles').select('*').eq('id',user.id).single());profiles.push(own)}
 cloudData={...cloudData,debates:debates.map(cloudDebate),users:profiles,subscriptions:subscriptions.map(s=>({user:s.user_id,id:s.debate_id})),settings:Object.fromEntries(prefs.map(p=>[p.user_id,p.settings]))};
 cloudReady=true;cloudBanner('Connected to Supabase · shared accounts, debates, and messages');header();
 if(!isRoom){if(render)renderDashboard();else renderList()}else if(roomJoined){const fresh=cloudData.debates.find(d=>d.id===roomId);if(fresh)room=fresh;updateRoom()}
 await cloudMessages();
 }catch(e){cloudReady=false;cloudBanner(cloudError(e),true);if(render&&!isRoom){header();renderDashboard()}}finally{cloudRefreshBusy=false}}
async function cloudMessages(){const generation=cloudGeneration,requestedChannel=channel;if(!cloudSession){cloudData.chats=[];if(!isRoom)renderChat();return}try{
 let request=cloudClient.from('messages').select('*').order('created_at',{ascending:false}).limit(100);
 if(channel==='lobby')request=request.is('recipient',null);else{const other=channel.split(':').find(id=>id!==cloudSession.user.id);if(!/^[0-9a-f-]{36}$/i.test(other||''))return;request=request.or(`and(sender.eq.${cloudSession.user.id},recipient.eq.${other}),and(sender.eq.${other},recipient.eq.${cloudSession.user.id})`)}
 const rows=await cloudResult(request);if(generation!==cloudGeneration||requestedChannel!==channel)return;
 const incoming=rows.reverse().map(m=>({id:m.id,from:m.sender,text:m.body,at:new Date(m.created_at).getTime(),channel:m.recipient?[m.sender,m.recipient].sort().join(':'):'lobby'}));
 const changed=JSON.stringify(incoming)!==JSON.stringify(cloudData.chats);cloudData.chats=incoming;
 if(!isRoom&&(changed||!$('#messages'))) {const input=$('#chat-content input'),draft=input?.value||'',focused=document.activeElement===input;renderChat();const next=$('#chat-content input');if(next&&draft){next.value=draft;if(focused)next.focus()}}
 }catch(e){cloudBanner('Messages could not refresh: '+cloudError(e),true)}}
function cloudAuth(signup){if(!cloudClient)return toast('Supabase could not load. Reload with an internet connection.');modal(signup?'Create your account':'Sign in',`<p class="muted">Your account works across devices. Sign in with email or your exact public username.</p><label>${signup?"Email":"Email or exact username"}<input name="email" type="${signup?"email":"text"}" required autocomplete="username"></label>${signup?'<label>Public alias<input name="alias" required maxlength="35" autocomplete="nickname"></label>':''}<label>Password<input name="password" type="password" required minlength="${signup?8:1}" autocomplete="${signup?'new-password':'current-password'}"></label>${signup?'<label>About you<textarea name="bio" maxlength="400"></textarea></label><label>Interests<input name="interests" maxlength="150"></label>':'<button type="button" class="ghost" onclick="cloudResetPassword()">Forgot password?</button>'}`,async(f,el)=>{
 let aliasSession=null;if(!signup&&!f.get('email').includes('@')){const {data,error}=await cloudClient.functions.invoke('account-login',{body:{username:f.get('email').trim(),password:f.get('password')}});if(error)throw Error('Username sign-in failed or is not deployed. Try your email address.');const saved=await cloudClient.auth.setSession(data);if(saved.error)throw saved.error;aliasSession=saved.data.session;}
 let result=aliasSession?{data:{session:aliasSession}}:signup?await cloudClient.auth.signUp({email:f.get('email').trim(),password:f.get('password'),options:{emailRedirectTo:new URL('index.html',location.href).href,data:{alias:f.get('alias').trim(),bio:f.get('bio'),interests:f.get('interests')}}}):await cloudClient.auth.signInWithPassword({email:f.get('email').trim(),password:f.get('password')});
 if(result.error)throw Error(result.error.message);el.close();if(result.data.session){await cloudAcceptSession(result.data.session);toast('Signed in')}else toast('Check your email to confirm your account, then sign in. Existing accounts can use Sign in or password reset.');
 },signup?'Sign up':'Sign in')}
function cloudResetPassword(){modal('Reset password','<label>Email<input name="email" type="email" required autocomplete="email"></label>',async(f,el)=>{await cloudResult(cloudClient.auth.resetPasswordForEmail(f.get('email').trim(),{redirectTo:new URL('index.html',location.href).href}));el.close();toast('If this account exists, a password-reset email will arrive.')},'Send reset email')}
function cloudRecovery(){modal('Choose a new password','<label>New password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>',async(f,el)=>{await cloudResult(cloudClient.auth.updateUser({password:f.get('password')}));el.close();toast('Password updated')},'Update password')}
async function cloudAcceptSession(session){if(roomJoined&&cloudSession?.user?.id!==session?.user?.id){stopRecording();cleanup()}cloudGeneration++;cloudSession=session;cloudData.chats=[];channel='lobby';sessionStorage.removeItem('openfloor.user');if(session)sessionStorage.setItem('openfloor.user',session.user.id);await cloudRefresh(true);if(cloudSubscription)cloudClient.removeChannel(cloudSubscription);cloudSubscription=null;if(session)cloudSubscription=cloudClient.channel('openfloor-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>cloudMessages()).subscribe();if(isRoom&&!roomJoined)await cloudLoadRoom()}
async function cloudSignout(){if(roomJoined)return toast('Leave the debate before signing out.');try{await cloudResult(cloudClient.auth.signOut());await cloudAcceptSession(null)}catch(e){toast(cloudError(e))}}
function cloudSettings(){if(!cloudSignedIn())return;const u=me(),s=read().settings[u.id]||{};modal('Your settings',settingsFields(u,s,true),async(f,el)=>{
 let image=u.avatar,file=f.get('avatar');if(file?.size){if(file.size>200000||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a PNG, JPEG, or WebP image under 200 KB.');image=await new Promise((r,j)=>{const reader=new FileReader();reader.onload=()=>r(reader.result);reader.onerror=j;reader.readAsDataURL(file)})}
 await cloudResult(cloudClient.from('profiles').update({bio:f.get('bio'),interests:f.get('interests'),avatar:image,grade_hidden:f.has('gradeHidden')}).eq('id',u.id));
 await cloudResult(cloudClient.from('preferences').upsert({user_id:u.id,settings:{notify:f.has('notify'),lead:Number(f.get('lead')),popular:f.has('popular')}}));el.close();await cloudRefresh(true);toast('Settings saved online')},'Save changes',{wide:true})}
async function cloudAdmin(){if(!cloudSignedIn())return;try{if(!await cloudResult(cloudClient.rpc('is_admin')))return toast('Admin access required. The project owner must grant the first admin role in SQL Editor.');modal('Promote an administrator','<p class="muted">Only an existing administrator can grant this role.</p><label>Existing account alias<input name="alias" required maxlength="35"></label>',async(f,el)=>{await cloudResult(cloudClient.rpc('promote_admin',{p_alias:f.get('alias')}));el.close();toast('Administrator promoted')},'Promote account')}catch(e){toast(cloudError(e))}}
function cloudCreateDebate(challenge=''){if(!cloudSignedIn())return;const el=modal(challenge?'Challenge to a debate':'Create a shared debate',createDebateFields(true),async(f,el)=>{
 const payload={...parseDraft(f),mode:f.get('mode')||'duel',openMinutes:Number(f.get('openMinutes')||15),challenge,group:f.get('group'),start:f.get('start')?new Date(f.get('start')).getTime():Date.now(),privacy:f.get('privacy'),spectators:f.has('spectators'),audienceVote:f.has('audienceVote'),capacity:Number(f.get('capacity')),ongoing:f.get('queueMode')!=='once',queueMode:f.get('queueMode')};
 if(typeof RoomRules!=='undefined')RoomRules.validateFormat(payload);
 if(payload.privacy==='password'&&f.get('password').length<6)throw Error('Set a room password of at least six characters.');
 const row=await cloudResult(cloudClient.rpc('create_debate',{p_payload:payload,p_password:f.get('password')}));el.close();await cloudRefresh(true);const d=cloudDebate(row);cloudRoomReady(d)
 },'Create shared room',{wide:true});wireDebateFields(el)}
function cloudRoomReady(d){const link=new URL('debate.html?id='+d.id,location.href).href;modal('Your shared room is ready',`<p>${esc(d.title)}</p><label>Room link<input id="shared-room-link" readonly value="${esc(link)}"></label><div class="row" style="margin-top:10px"><button type="button" id="copy-room-link" onclick="cloudCopyRoomLink()">▣ Copy link</button><span id="copy-room-status" role="status" aria-live="polite"></span></div><p class="foot">Send this link to your opponent.</p><a class="primary" style="display:block;padding:10px;margin-top:15px" href="debate.html?id=${esc(d.id)}">Enter room ↗</a>`,null)}
async function cloudCopyRoomLink(){const input=$('#shared-room-link'),button=$('#copy-room-link'),status=$('#copy-room-status');if(!input||!button||!status)return;button.disabled=true;try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(input.value);status.textContent='Link copied!';button.textContent='✓ Copied'}catch{input.focus();input.select();status.textContent='Copy was blocked. The link is selected—press Ctrl+C (⌘C on Mac) to copy it.';button.textContent='▣ Copy link'}finally{button.disabled=false}}
async function cloudSchedule(id){if(!cloudSignedIn())return;try{let exists=read().subscriptions.some(s=>s.user===me().id&&s.id===id);await cloudResult(exists?cloudClient.from('subscriptions').delete().eq('user_id',me().id).eq('debate_id',id):cloudClient.from('subscriptions').insert({user_id:me().id,debate_id:id}));await cloudRefresh();toast(exists?'Removed from your schedule':'Added to your shared schedule')}catch(e){toast(cloudError(e))}}
async function cloudSendChat(e){e.preventDefault();if(!cloudSignedIn())return;const text=e.target.message.value.trim();if(!text)return;const button=e.target.querySelector('button');button.disabled=true;try{const recipient=channel==='lobby'?null:channel.split(':').find(id=>id!==me().id);await cloudResult(cloudClient.from('messages').insert({sender:me().id,recipient,body:text}));e.target.reset();await cloudMessages()}catch(err){toast('Message was not sent: '+cloudError(err))}finally{button.disabled=false}}
async function cloudLoadRoom(password=''){if(!roomId||!/^[0-9a-f-]{36}$/i.test(roomId)){$('#app').innerHTML='<div class="empty"><h1>Room not found</h1><p>Local sample links do not identify shared debates.</p><a href="index.html">Back to dashboard</a></div>';return}try{const row=await cloudResult(cloudClient.rpc('open_debate',{p_id:roomId,p_password:password}));const d=cloudDebate(row);edit(db=>{db.debates=db.debates.filter(x=>x.id!==d.id);db.debates.push(d)});initRoom()}catch(e){$('#app').innerHTML=`<div class="pod" style="max-width:550px;margin:50px auto"><h1>Enter this room</h1><p class="context">${esc(cloudError(e))}</p>${cloudSession?'<form id="unlock-room"><label>Room password<input name="password" type="password" maxlength="200"></label><button class="primary" style="margin-top:16px">Unlock / retry</button></form>':'<button onclick="auth(false)">Sign in</button>'}<p class="foot"><a href="index.html">← Dashboard</a></p></div>`;if($('#unlock-room'))$('#unlock-room').onsubmit=e=>{e.preventDefault();cloudLoadRoom(e.target.password.value)}}}
const originalJoinRoom=joinRoom,originalCleanup=cleanup;
async function cloudJoinRoom(e){e.preventDefault();if(!cloudSignedIn())return;const f=new FormData(e.target);if(!f.has('consent'))return $('#entry-error').textContent='Acknowledge the recording notice to enter.';try{
 await cloudResult(cloudClient.rpc('enter_room',{p_id:roomId,p_role:f.get('role'),p_tab:tabId}));
 e.target.alias.value=me().alias;await originalJoinRoom(e);
 if(!roomJoined){await cloudClient.rpc('leave_room',{p_tab:tabId});return}
 await cloudRoomRoster();cloudRoomHeartbeat=setInterval(async()=>{try{const alive=await cloudResult(cloudClient.rpc('heartbeat_room',{p_tab:tabId}));if(!alive)throw Error('Room reservation expired. Leave and rejoin.');await cloudRoomRoster()}catch(err){cloudBanner('Room connection lost: '+cloudError(err),true);stopRecording();cloudCleanup();cloudBanner('Room reservation could not be renewed. Media stopped. Save your recording, leave, and rejoin. '+cloudError(err),true)}},10000);
 }catch(err){$('#entry-error').textContent=cloudError(err)}}
async function cloudRoomRoster(){if(!roomJoined)return;const [members,proposal]=await Promise.all([cloudResult(cloudClient.from('room_members').select('user_id,role,expires_at').eq('debate_id',roomId)),cloudResult(cloudClient.from('topic_proposals').select('*').eq('debate_id',roomId))]);let s=state();const seats={};for(let m of members.filter(m=>m.role!=='viewer')){let p=read().users.find(p=>p.id===m.user_id);if(!p){p=await cloudResult(cloudClient.from('profiles').select('*').eq('id',m.user_id).single());edit(d=>d.users.push(p))}seats[m.role]={id:m.user_id,alias:p.alias,avatar:p.avatar,until:new Date(m.expires_at).getTime()}}s.seats=seats;if(proposal.length){const proposer=members.find(m=>m.user_id===proposal[0].proposer);s.proposal={by:proposer?.role||'opponent',draft:proposal[0].draft}}else s.proposal=null;put(roomKey,s);updateRoom()}
function cloudCleanup(){clearInterval(cloudRoomHeartbeat);cloudRoomHeartbeat=null;if(cloudClient&&roomJoined)cloudClient.rpc('leave_room',{p_tab:tabId}).then(()=>{}).catch(()=>{});originalCleanup()}
function cloudProposeEdit(){if(role==='viewer'||state().phase!=='lobby')return;modal('Propose topic & format',draftFields(room),async(f,el)=>{let draft=parseDraft(f);await cloudResult(cloudClient.rpc('propose_topic',{p_id:roomId,p_draft:draft}));mutate(s=>{s.proposal={by:role,draft};s.ready={}});el.close();toast('Proposal saved. Your opponent must approve it.')},'Send for approval',{wide:true})}
async function cloudApproveEdit(yes){if(role==='viewer'||state().phase!=='lobby')return;try{await cloudResult(cloudClient.rpc('approve_topic',{p_id:roomId,p_approve:yes}));const row=await cloudResult(cloudClient.from('debates').select('*').eq('id',roomId).single());room=cloudDebate(row);edit(d=>{d.debates=d.debates.filter(x=>x.id!==roomId);d.debates.push(room)});mutate(s=>{s.proposal=null;s.ready={}});conn?.send({type:'room',room})}catch(e){toast(cloudError(e))}}
function confirmationCallback(href){const url=new URL(href),hash=new URLSearchParams(url.hash.slice(1));return {signup:(hash.get('type')||url.searchParams.get('type'))==='signup',error:hash.has('error')||url.searchParams.has('error'),hasToken:hash.has('access_token')}}
function confirmationNotice(message,error=false){let el=$('#email-confirmation-status');if(!el){el=document.createElement('div');el.id='email-confirmation-status';el.className='notice';el.style.margin='12px 4%';document.querySelector('header').after(el)}el.setAttribute('role',error?'alert':'status');el.setAttribute('aria-live','polite');el.textContent=message;el.style.borderColor=error?'#784343':'#8ba64d'}
async function showEmailConfirmation(callback,session,sessionError){if(isRoom)return;if(callback.error){confirmationNotice('This email link is invalid or has expired. Request a new verification email, or sign in if you already confirmed your email.',true);return}if(!callback.signup)return;if(sessionError||!session||!callback.hasToken){confirmationNotice('We could not confirm this email link. Try signing in, or request a new verification email.',true);return}try{const {data,error}=await cloudClient.auth.getUser();if(error||!data?.user?.email_confirmed_at)throw Error('Unconfirmed');confirmationNotice('Your email was successfully verified. You are now signed in.')}catch{confirmationNotice('We could not verify your email status. Please try signing in again.',true)}}
async function initCloud(){if(!CLOUD_ENABLED)return;sessionStorage.removeItem('openfloor.user');auth=cloudAuth;signout=cloudSignout;requireUser=cloudSignedIn;settings=cloudSettings;adminPanel=cloudAdmin;createDebate=cloudCreateDebate;schedule=cloudSchedule;sendChat=cloudSendChat;joinRoom=cloudJoinRoom;cleanup=cloudCleanup;proposeEdit=cloudProposeEdit;approveEdit=cloudApproveEdit;importRooms=()=>toast('Local imports are not uploaded automatically. Create a shared debate to publish it.');const originalOpenDM=openDM;openDM=id=>{originalOpenDM(id);cloudMessages()};if(typeof installRoomV2==='function')installRoomV2();header();if(!isRoom)renderDashboard();cloudBanner('Connecting to the shared database…');
 if(!window.supabase){cloudBanner('Supabase client failed to load. Reload with an internet connection.',true);return}
 const emailCallback=confirmationCallback(location.href);
 cloudClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:cloudAuthOptions()});
 const {data,error}=await cloudClient.auth.getSession();await showEmailConfirmation(emailCallback,data?.session,error);if(error)cloudBanner(error.message,true);await cloudAcceptSession(data?.session||null);
 cloudClient.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{cloudAuthChanged(event,session).catch(e=>cloudBanner(cloudError(e),true))},0)});
 setInterval(()=>{if(!isRoom){const d=read().debates.find(d=>d.privacy==='public'&&d.start<=Date.now());if(d&&$('#featured-time'))$('#featured-time').textContent=minutes((Date.now()-d.start)/1000)}},1000);
 setInterval(()=>{if(!document.hidden){cloudRefresh();if(!isRoom&&cloudReady)checkReminders()}},15000);
}
if(CLOUD_ENABLED)initCloud().catch(e=>cloudBanner(cloudError(e),true));

function cloudChangePassword(){if(!cloudSignedIn())return;modal('Change password','<label>New password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm new password<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>',async(f,el)=>{if(f.get('password')!==f.get('confirm'))throw Error('Passwords do not match.');await cloudResult(cloudClient.auth.updateUser({password:f.get('password')}));el.close();toast('Password changed. Use the new password the next time you sign in.')},'Change password')}
</script></body></html>
