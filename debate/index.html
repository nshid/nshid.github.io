/* Shared layout: keep content readable and actions in view at every viewport. */
html { scrollbar-gutter: stable; }
body.modal-open { overflow: hidden; }
[hidden] { display: none !important; }
input, select, textarea, .row > *, .columns > *, .room-grid > *, .grid2 > * { min-width: 0; }
button, .pill, .notice, .foot, .context, .detail, .member, .profile-bio, .profile-interests { overflow-wrap: anywhere; }
h1, h2, h3, .member-list, .score-card { overflow-wrap: anywhere; }
input[type="checkbox"] { flex: 0 0 16px; width: 16px; height: 16px; margin: 3px 0; accent-color: var(--accent); }
.check { align-items: flex-start; line-height: 1.5; }
.composer input { flex: 1; width: 0; }
.composer button, .member .avatar { flex-shrink: 0; }
.toolbar .tabs { min-width: 0; }
.toolbar .search { flex: 1 1 180px; width: auto; }
.account-nav { justify-content: flex-end; flex-wrap: nowrap; }
.account-button { max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .brand { flex-shrink: 0; white-space: nowrap; }
.member > div { min-width: 0; }
.score-row { flex-wrap: wrap; }
.score-row meter { min-width: 80px; }
#ai-result { white-space: normal; padding: 4px 6px 14px 0; scroll-padding-block: 12px; }
.messages { scroll-padding-block: 16px; overscroll-behavior: contain; }
.tile-top { gap: 8px; }
.tile-top > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-timer { flex-shrink: 0; }
.identity { width: 100%; min-width: 0; padding: 34px 10px 48px; }
.identity p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v2-stage .identity .avatar { margin-bottom: 6px; }
.controls { gap: 8px; padding: 16px 0; }
.entry-pod { margin-block: 24px; }
.entry-pod .waiting-fact { margin-top: 0; }
.waiting-fact { overflow-wrap: anywhere; }

/* Native dialog provides focus trapping, Escape and a true modal backdrop. */
dialog {
  width: min(560px, calc(100vw - 48px));
  max-width: none;
  max-height: calc(100vh - 48px);
  max-height: calc(100dvh - 48px);
  padding: 0;
  overflow: hidden;
  box-shadow: 0 24px 100px #0009;
}
dialog.dialog-wide { width: min(840px, calc(100vw - 48px)); }
.dialog-form { display: flex; flex-direction: column; max-height: calc(100vh - 50px); max-height: calc(100dvh - 50px); min-height: 0; }
.dialog-header { flex: none; display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 16px 20px 16px 24px; border-bottom: 1px solid var(--line); }
.dialog-header h2 { margin: 0; font-size: 21px; line-height: 1.35; letter-spacing: -.4px; }
.dialog-close { flex: 0 0 36px; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; font-size: 25px; line-height: 1; background: transparent; border-color: transparent; }
.dialog-scroll-frame { display: flex; min-height: 0; padding-block: 8px; overflow: hidden; }
.dialog-body { flex: 1; min-width: 0; min-height: 0; overflow: auto; padding: 8px 24px 12px; scroll-padding-block: 20px; overscroll-behavior: contain; scrollbar-gutter: stable; overflow-wrap: anywhere; }
.dialog-footer { flex: none; padding: 14px 24px; border-top: 1px solid var(--line); background: #16191b; }
.dialog-actions { margin: 0; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.dialog-error { margin: 0 0 12px; line-height: 1.5; max-height: 6em; overflow: auto; overflow-wrap: anywhere; }
.dialog-error:empty { display: none; }
.dialog-body label { font-size: 13px; margin: 10px 0 0; }
.dialog-body label > input:not([type="checkbox"]), .dialog-body label > select, .dialog-body label > textarea { display: block; margin-top: 5px; }
.dialog-body label small { display: block; margin-top: 4px; }
.dialog-body input, .dialog-body select, .dialog-body textarea { padding: 8px 10px; font-size: 14px; line-height: 1.4; }
.dialog-body input[type="file"] { width: 100%; font-size: 12px; }
.dialog-body input[type="file"]::file-selector-button { margin-right: 8px; border: 0; border-radius: 3px; padding: 4px 6px; background: #303638; color: #f3f4f4; }
.dialog-body textarea { min-height: 80px; }
.dialog-body .check { margin-block: 12px; }
.dialog-body .foot, .field-help { margin-top: 12px; font-size: 12px; line-height: 1.5; color: var(--muted); }
.dialog-body > :first-child { margin-top: 0; }
.dialog-body .grid2 { gap: 8px 18px; }
.settings-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 24px; }
.settings-section { min-width: 0; }
.settings-section + .settings-section { border-left: 1px solid var(--line); padding-left: 24px; }
.settings-section h3 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.settings-section textarea { height: 82px; }
.settings-section .notification-button { width: 100%; font-size: 13px; margin-top: 2px; }
.settings-tools { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 16px; margin-top: 10px; border-top: 1px solid var(--line); }
.settings-tools > button { padding: 7px 11px; font-size: 12px; }
.settings-tools .import-control { margin: 0; max-width: 240px; }
.profile-heading { display: flex; align-items: center; gap: 14px; padding-block: 2px 10px; }
.profile-heading .avatar { width: 52px; height: 52px; flex-shrink: 0; }
.profile-bio { white-space: pre-wrap; margin: 8px 0 12px; }
.profile-interests { margin: 10px 0 18px; }
.dialog-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; padding-bottom: 8px; }
.dialog-tabs button { padding: 7px 14px; background: transparent; border-color: transparent; color: var(--muted); }
.dialog-tabs button[aria-selected="true"] { color: var(--accent); background: #25301b; border-color: #3b4a29; }
[role="tabpanel"] { min-width: 0; }
.field-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
.field-heading label { margin: 0; }
.field-heading button { padding: 4px 8px; font-size: 12px; }
.draft-writing { margin-top: 10px; }
.draft-writing textarea { height: 156px; min-height: 110px; }
.access-options { margin-top: 12px; }

/* Subtopics use the existing dialog tabs and one compact editor at a time. */
.subtopic-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 12px; }
.subtopic-toolbar .row { gap: 6px; }
.subtopic-toolbar button { padding: 6px 9px; font-size: 12px; }
.subtopic-list { display: grid; gap: 4px; }
.dialog-body [data-subtopics] > .field-help:last-child { margin: 8px 0 0; }
.subtopic-card { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.subtopic-header { display: flex; align-items: center; min-width: 0; background: #16191b; }
.subtopic-toggle { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; padding: 7px 10px; border: 0; border-radius: 0; background: transparent; text-align: left; font-size: 12px; }

const topicMainContexts={
 "Should AI-generated content always be labeled?": "Images, writing and audio can combine human decisions with machine-generated material. Mandatory labeling would make that involvement more visible, but the boundary between routine editing and generated authorship is not straightforward. The dispute concerns what audiences need to know and whether a universal label can communicate it meaningfully.",
 "Should social platforms offer chronological feeds by default?": "A social feed can show posts in publication order or choose an order based on predicted interest. Making chronology the default shifts the starting point toward accounts a person deliberately follows, while potentially making useful older posts harder to discover. Users could still choose another view; the central question is which experience a platform should present first.",
 "Should people own the data collected about them?": "Data collected through everyday services can become a resource for advertising, product development and analysis. Treating that information as personal property could give people stronger control over its use, but a record may concern several people and be copied or transformed many times. Ownership also differs from privacy rights that cannot simply be sold away.",
 "Should schools teach students how to challenge AI answers?": "An AI answer can sound complete even when the underlying reasoning is weak or a cited source does not support it. Teaching students to question such answers would make verification part of ordinary schoolwork. The educational choice is how much attention to give this emerging tool alongside broader reading, reasoning and research skills.",
 "Should public agencies use only open-source software?": "Public agencies depend on software for records, communication and services that residents may be required to use. An open-source-only rule would prioritize inspectable and modifiable systems over proprietary licensing. Its practical consequences depend on whether agencies can obtain suitable applications, support and security maintenance without excluding necessary specialized tools.",
 "Should users have a legal right to repair their devices?": "Buying a device does not always provide the tools or information needed to repair it. A legal right to repair would change the relationship between product ownership and manufacturer control over maintenance. The policy has to reconcile longer usable life and independent repair with concerns about unsafe modifications, cybersecurity and responsibility for failures.",
 "Should recommendation algorithms be independently audited?": "Recommendation algorithms help determine the visibility of posts, products and creators. Independent auditing would introduce outside scrutiny into systems normally evaluated by their operators. The debate concerns what an auditor could reliably establish, what access would be necessary and how findings should lead to accountability.",
 "Should children’s apps be free of targeted advertising?": "Children's apps can fund their services by using information about users to select advertising. Prohibiting that form of targeting would separate access to an app from some commercial uses of children's activity. The choice involves both children's ability to understand persuasion and the funding models that would replace personalized advertising.",
 "Should the standard workweek be four days?": "A four-day standard workweek could mean fewer total hours, or the same hours compressed into longer days; those are different proposals. Reducing hours without reducing weekly pay changes expectations about productivity and staffing. The debate turns on which workplaces could sustain the change and how its benefits and costs would reach hourly workers as well as salaried staff.",
 "Should job advertisements always disclose salary ranges?": "Applicants often decide whether to pursue a role before knowing what it pays. Requiring salary ranges in advertisements would move part of the negotiation into public view and allow earlier comparisons. A useful policy would need to address ranges that are technically disclosed but too broad to guide a decision.",
 "Should employees have a right to disconnect after work?": "Work communication can continue after a person's scheduled day has ended. A right to disconnect would limit the expectation of responding during personal time rather than necessarily prohibit sending a message. Different time zones, genuine emergencies and employee-controlled flexible hours make the boundaries of that right important.",
 "Should companies share profits with their employees?": "Employees contribute to a company's results while usually receiving compensation through wages, salaries or individual incentives. Profit sharing would give them an additional collective stake in financial performance. The proposal raises questions about predictable income, how profits are measured and whether sharing upside should also expose workers to business volatility.",
 "Should unpaid internships be prohibited?": "An unpaid internship can be presented as a learning opportunity while also supplying useful work to an organization. Prohibiting unpaid placements would establish a stronger compensation requirement, but might also change which organizations offer training positions. The key distinction is between access to genuine education and access to labor without wages.",
 "Should hiring prioritize demonstrated skills over degrees?": "Hiring managers use qualifications, experience and direct demonstrations of ability to judge applicants. Prioritizing skills over degrees would reduce reliance on formal educational credentials as an initial filter. The alternative still needs credible ways to assess competence, particularly where a mistake can affect public safety or professional responsibility.",
 "Should large companies give workers seats on their boards?": "Corporate boards make decisions about investment, leadership and the direction of a business. Giving workers seats would bring employees into a structure that often represents owners' interests more directly. The proposal concerns how workplace experience and financial ownership should influence decisions when their priorities diverge.",
 "Should remote work be the default for suitable jobs?": "Some jobs can be performed away from a shared workplace, but organizations differ in how much attendance they expect. A remote-work default would place the burden on employers to justify office presence for suitable roles. The tradeoffs include access to employment, coordination, supervision and the experience of people whose work cannot be remote.",
 "Should schools replace most homework with independent reading?": "Homework can reinforce lessons, while independent reading offers practice sustained by a student's own attention and interests. Replacing most homework with reading would change the balance between subject-specific exercises and broader literacy. Its value depends on student age, the subjects involved and the support available outside school.",
 "Should students help design their school curriculum?": "School curricula are usually shaped by educators and public authorities rather than by the students following them. A larger student role could make learning feel more relevant and give young people experience of collective decisions. It also raises the question of how immediate interests should be balanced with foundational knowledge and future needs.",
 "Should universities replace timed exams with projects?": "A timed exam captures performance during a fixed window; a project shows work developed over a longer period. Replacing exams with projects would change what universities reward and how students organize their effort. Fair assessment would have to account for access to help, resources and opportunities to revise work.",
 "Should financial literacy be a required school subject?": "Financial literacy covers decisions that people may face about income, spending, credit and saving. Making it a required subject would guarantee curriculum time rather than leave exposure to families or optional courses. The question is what schools can usefully teach without implying that knowledge alone solves financial insecurity.",
 "Should schools start later in the morning?": "The school day is linked to transport schedules, family routines and activities outside lessons. Moving its start later changes more than the time of the first class. A workable proposal needs to account for students' rest alongside the effects on childcare, commuting, staff and the end of the school day.",
 "Should every student learn a musical instrument?": "Instrumental music requires repeated practice and gives students a direct role in producing sound with others or alone. Making it universal would turn an opportunity often offered selectively into a shared part of education. Implementation would need to respect varied interests and abilities while providing instruments and instruction rather than shifting those costs to families.",
 "Should community service be required for graduation?": "A graduation service requirement makes contributing time to a community organization part of completing school. Supporters can view it as civic education, while critics may question whether compulsory hours cultivate voluntary commitment. The design matters when students have jobs, caring duties or limited access to suitable placements.",
 "Should university lectures be freely available online?": "A university lecture can be made available beyond the classroom through recordings or other online materials. Free access would open part of a university's teaching to people who are not enrolled. It would not automatically provide tutorials, assessment or a qualification, so the proposal concerns one layer of educational access rather than an entire free degree.",
 "Should cities make public transportation free?": "Fare-free public transport removes the ticket price from a traveler's immediate decision. It does not remove the cost of running the network or guarantee that a useful route exists. The debate concerns whether public money should prioritize free entry, better service, or a combination that makes alternatives to driving more practical.",
 "Should governments prioritize repairing products over recycling them?": "Repair and recycling address different points in a product's life. Giving repair priority would focus policy on keeping items useful before recovering their materials as waste. That shift involves product design, spare parts, repair skills and the economic reasons households or businesses choose replacement instead.",
 "Should new public buildings be required to generate renewable energy?": "Public construction offers an opportunity to incorporate energy generation when a building is planned. A renewable-generation requirement would make that opportunity an obligation rather than a case-by-case choice. Buildings differ in location, available space and energy demand, so the case for a universal rule must address when off-site clean energy might be a better option.",
 "Should urban centers restrict private cars?": "Urban streets provide access to homes, jobs and businesses while also serving as shared public space. Limiting private cars could reduce some traffic-related harms and free space for other uses, but mobility needs would remain. The central issue is whether a city can offer practical alternatives and fair exceptions rather than simply displace traffic and inconvenience to neighboring areas.",
 "Should food packaging use standardized reusable containers?": "Standardized reusable food containers would replace some single-use packaging with a shared return-and-cleaning system. Standardization could make containers easier to exchange across businesses, but would require coordination among producers, retailers and customers. The environmental and practical case depends on repeated use, safe cleaning and convenient returns.",
 "Should cities replace decorative lawns with native plants?": "Decorative lawns and native planting serve different purposes in the urban landscape. Replacing some lawns would place more emphasis on habitat and locally suited vegetation, while changing the appearance and use of public green space. Decisions need to distinguish ornamental areas from places used for sports, play and informal gathering.",
 "Should nuclear power be part of a low-carbon energy strategy?": "Reducing emissions from electricity generation requires choices about reliable supply, investment and infrastructure. Nuclear power offers a different set of operating characteristics and long-term obligations from wind, solar and other sources. The debate concerns its role within an energy mix, including construction timelines, waste stewardship and the alternatives available in a particular system.",
 "Should frequent flyers pay higher environmental charges?": "A frequent-flyer charge would increase the cost of repeated flying rather than apply the same charge to every passenger. Its aim is to place a greater burden on intensive use of air travel, but frequency alone does not reveal why someone travels. The proposal needs a fair counting system and a clear account of how revenue or changed travel choices would serve environmental goals.",
 "Should libraries lend tools and household equipment?": "Libraries already organize shared access to resources that individuals do not all need to own. Lending tools and household equipment extends that principle to objects requiring storage, maintenance and sometimes safety instruction. The debate concerns whether this is a useful extension of a library's public role or a diversion from services it is better equipped to provide.",
 "Should residents directly decide part of their city’s budget?": "A city budget turns public priorities into spending commitments. Letting residents decide a portion directly would create a different route from electing representatives and responding to consultations. The value of the process depends on who participates, how choices are explained and whether the selected projects can actually be delivered.",
 "Should vacant shops become temporary community spaces?": "An empty shop can remain unused while local groups struggle to find affordable space. Temporary community use connects those two circumstances without necessarily changing the property's long-term purpose. Agreements must balance immediate public value with costs, safety responsibilities and the uncertainty faced by groups that may later have to leave.",
 "Should cities prioritize pedestrian space over parking?": "Street space is finite, and allocating it to parked vehicles limits other possible uses. Prioritizing pedestrians would put more weight on movement, access and public life outside cars. A credible redesign must still consider deliveries, disabled access and the needs of people for whom driving is currently the only workable option.",
 "Should public parks host more community gardens?": "A community garden gives residents a place to grow food or plants and work alongside others. Putting more gardens in parks would allocate public land to an activity that requires sustained participation. The decision involves both potential community benefits and the claims of park users who want open space for different purposes.",
 "Should local museums offer free admission?": "Museum admission charges contribute revenue while creating a price for access to collections and exhibitions. Free admission would remove that barrier, but the institution would still need funding and visitors might face other obstacles to attending. The debate is about how a local cultural institution should balance public access with the resources needed to care for and interpret its collections.",
 "Should neighborhoods have a quiet hour every evening?": "A neighborhood quiet hour would create a shared expectation about sound at a particular time. Such a rule could support rest, but neighbors have different working hours, family needs and ideas about ordinary daily activity. Its fairness depends on reasonable limits and enforcement that distinguishes serious disturbance from unavoidable living sounds.",
 "Should public services be available without smartphone apps?": "Moving services into apps can simplify some transactions while excluding people who cannot or do not wish to use them. Requiring a non-app route would protect alternative access to services that may be essential. The question is how to maintain that access without creating a slower or inferior service for the people who use it.",
 "Should public agencies lead space exploration?": "Space exploration can be led through public missions, commercial ventures or partnerships between them. Public leadership places decisions within institutions expected to pursue collective goals, while commercial activity can bring different incentives and capabilities. The debate concerns who sets priorities and bears responsibility, not simply who builds the spacecraft.",
 "Should ocean exploration receive more funding than crewed spaceflight?": "Ocean exploration and crewed spaceflight compete for attention while addressing different scientific questions. Giving ocean research more funding would express a priority between programs whose benefits are not measured in the same way. The comparison should distinguish scientific value from the particular costs and symbolism of sending humans into space.",
 "Should publicly funded research be freely accessible?": "Public money can support research whose finished publications are difficult for some readers to access. Requiring free access would connect public funding with wider availability of its results. Publishing, quality control and preservation still require resources, so the policy must also consider who pays for those services.",
 "Should scientists prioritize replication over novel findings?": "A new finding can attract attention before it is tested across further studies. Prioritizing replication would give greater weight to checking the reliability and limits of existing knowledge. The challenge is to strengthen confidence in research without neglecting the new questions that make scientific progress possible.",
 "Should governments fund a permanent research base on the Moon?": "A permanent Moon base would turn a sequence of missions into an ongoing presence requiring supplies, maintenance and institutional commitment. Its case may involve science, exploration or technological development, but those objectives need to justify long-term spending. Robotic missions and temporary visits provide alternative ways to pursue some of the same aims.",
 "Should citizen science be part of school science courses?": "Citizen-science projects allow people outside professional research teams to contribute to scientific work. Including them in school courses could connect lessons with a real investigation rather than a classroom exercise alone. A useful project must provide educational meaning as well as reliable data and manageable responsibilities for teachers.",
 "Should research grants be partly allocated by lottery among qualified proposals?": "Research proposals can remain difficult to rank even after reviewers agree that several meet a strong quality threshold. A partial lottery would use chance for the final decision among qualified proposals instead of treating small ranking differences as decisive. The debate concerns fairness, uncertainty in evaluation and the kinds of research such a system would encourage.",
 "Should science museums emphasize unresolved questions over established discoveries?": "A science museum can present well-established knowledge or invite visitors into questions researchers have not resolved. Emphasizing open questions could make the process of inquiry more visible. It also requires enough explanation to show the difference between productive uncertainty and a lack of evidence for a claim.",
 "Should public funding support local journalism?": "Local reporting helps communities follow institutions and events close to home. Public support could sustain that work where commercial revenue is insufficient, but funding from public bodies introduces questions about editorial independence. The design of support matters as much as the decision to spend it.",
 "Should museums return objects acquired through colonial coercion?": "Some museum objects are contested because the circumstances of acquisition involved coercion under colonial rule. Returning them would recognize claims that possession and legal documentation alone may not settle. The debate connects historical responsibility with present-day decisions about custody, access and who should interpret cultural heritage.",
 "Should streaming platforms disclose how they pay artists?": "Streaming services distribute revenue through arrangements that listeners and artists may not fully understand. Disclosing payment methods would make the allocation more visible, but visibility alone does not settle what each participant should receive. The issue is whether transparency can improve accountability without obscuring the roles of contracts and other rights holders.",
 "Should cities fund public art before major sporting events?": "Public art and major sporting events are both possible expressions of a city's identity, but their costs and benefits unfold differently. Giving art priority would favor one form of public cultural investment over another. The choice needs to consider lasting use, access and which residents' interests are represented in the spending decision.",
 "Should book awards judge works without knowing the author’s identity?": "An author's reputation or identity can influence expectations before a judge reads a book. Anonymous judging would try to reduce that influence by focusing the initial decision on the work itself. The proposal becomes more complicated when an award's purpose includes recognizing particular communities or experiences.",
 "Should adaptations prioritize faithfulness to the original story?": "Moving a story into a different medium requires choices about what to retain, remove or reinterpret. Faithfulness can mean preserving events, emotional tone or the source's central concerns, and those aims can conflict. The debate concerns which obligations an adaptation owes to an existing work while becoming a work of its own.",
 "Should historical films clearly label invented scenes?": "Historical films use storytelling techniques that may blend documented events with invented detail. Clear labeling of invention could help audiences distinguish dramatic choices from historical evidence. The challenge is to communicate those distinctions usefully without suggesting that a short disclaimer resolves every question of interpretation.",
 "Should cultural institutions reserve space for emerging local artists?": "Cultural institutions make choices about whose work receives space, attention and professional support. Reserving opportunities for emerging local artists would make community development an explicit part of that process. A fair policy needs meaningful definitions and a balance between opening doors and preserving room for varied artistic judgments.",
 "Should honesty take priority over protecting someone’s feelings?": "Truthfulness and kindness are often compatible, but some situations put them in tension. Giving honesty priority would make accurate disclosure the stronger duty even when a person may be hurt by it. The force of that duty depends on what the information means for the other person's choices and whether withholding it is protection or paternalism.",
 "Should people prioritize local charities over international charities?": "Charitable giving can express responsibility toward one's immediate community or toward people with greater needs elsewhere. Prioritizing local causes gives proximity a special moral role. The debate asks how that role should compare with effectiveness, urgency and obligations that extend beyond familiar places.",
 "Should competitive games reward cooperation as much as individual performance?": "Games can reward individual achievement, coordinated teamwork or both. Giving cooperation equal weight would change what successful play looks like and which behaviors a game encourages. The proposal must distinguish cooperation that enriches the game from agreements that undermine fair competition.",
 "Should parents pay children for household chores?": "Household chores are necessary work, but families differ in whether they link them to pocket money. Paying children can introduce earning and budgeting, while also suggesting that routine contributions deserve separate rewards. The debate concerns how families teach responsibility and recognize effort without making every shared obligation a transaction.",
 "Should schools teach debate as a required life skill?": "Debating requires people to organize a case, listen to opposition and respond under constraints. Making it a required school subject would treat these practices as a general life skill rather than an extracurricular interest. The course would need to value careful reasoning and participation rather than equate argumentative confidence with understanding.",
 "Should public recognition matter when judging an act of generosity?": "Generosity can be performed privately or made visible to others. Public recognition may encourage further giving, while also raising doubts about whether praise is the giver's main concern. The moral question is how much weight to place on motives compared with the benefit received and the example set.",
 "Should people have a responsibility to challenge misinformation shared by friends?": "A misleading claim shared by a friend can create tension between preserving a relationship and correcting the information. Speaking up may help others assess the claim, but the setting and manner of correction can affect trust. The debate concerns when friendship creates a responsibility to intervene and when uncertainty, privacy or likely harm justifies another approach.",
 "Should apologies always include a concrete offer to repair harm?": "An apology can express regret and acknowledge wrongdoing without changing the harm already caused. Requiring an offer of repair would connect that acknowledgment with a practical response. Such a requirement must account for harms that cannot be reversed and for the affected person's right to reject a proposed remedy."
};

async function aiDraft(part,title){
 if(!CLOUD_ENABLED||!cloudSession?.user)return toast('Sign in to generate a custom draft.');
 const input=$('#draft-title'),context=$('#draft-context'),form=input.closest('form'),mode=form?.querySelector('[name=mode]')?.value||'duel';
 if(form?.dataset.drafting==='true')return;
 if(part==='subs'&&!context.value.trim())return toast('Write or generate topic context first.');
 const subvalues=()=>JSON.stringify([...form.querySelectorAll('[name=subtopicTitle],[name=subtopicContext]')].map(e=>e.value));
 const before={title:input.value,context:context.value,subs:subvalues()};
 const controls=[...form.querySelectorAll('button[onclick*="magicDraft"]')],states=controls.map(b=>b.disabled),labels=controls.map(b=>b.textContent);form.dataset.drafting='true';controls.forEach(b=>{b.disabled=true;b.textContent='Drafting…'});context.setAttribute('aria-busy','true');toast('Writing topic-specific background…');
 try{const {data,error}=await cloudClient.functions.invoke('debate-ai',{body:{action:'draft',part,title,context:before.context,mode}});
 if(error||data?.error){let message=data?.error;try{message||=(await error.context.json()).error}catch{}throw Error(message||'Drafting unavailable. Please retry.');}
 if(!input.isConnected||input.value!==before.title||subvalues()!==before.subs||context.value!==before.context||form.querySelector('[name=mode]')?.value!==mode)throw Error('Your draft changed while generation was running. Your edits were kept; retry when ready.');
 if(!data?.draft||typeof data.draft.context!=='string'||!Array.isArray(data.draft.subs))throw Error('The AI returned an incomplete draft. Please retry.');
 if(part!=='subs')context.value=data.draft.context;
 if(part!=='context'&&mode!=='bot')setDraftSubtopics(data.draft.subs);
 toast('Draft ready. Review the background and verify any factual claims.');
 }catch(e){toast(e.message)}finally{form.dataset.drafting='false';controls.forEach((b,i)=>{b.disabled=states[i];b.textContent=labels[i]});context.removeAttribute('aria-busy')}
}

function buildRoom(){$('#app').innerHTML=`<div class="row between"><a class="muted" href="index.html" onclick="event.preventDefault();leaveRoom()">← Leave room</a><div class="row"><span id="rec-status" class="pill">● Not recording</span><span class="pill">${role==='viewer'?'Spectator':'Debater '+role.toUpperCase()}</span></div></div><div class="row between" style="margin-top:24px"><div><div class="eyebrow">${esc(room.group)} / Debate room</div><h1 id="room-title" style="margin-top:8px">${esc(room.title)}</h1></div><button id="edit-topic" onclick="proposeEdit()">Edit topic & format ✦</button></div><div class="room-grid"><section><div class="roundbar"><div class="row between"><div><span class="eyebrow" id="phase-caption">Before the debate</span><h2 id="round-label">Waiting room</h2></div><div class="timer accent" id="round-time">--:--</div></div><div class="rounds" id="rounds"></div></div><div class="stage">${['a','b'].map(r=>`<section class="seat" id="seat-${r}"><div class="identity" id="identity-${r}"></div><video id="video-${r}" autoplay playsinline ${r===role?'muted':''} class="hidden"></video><span class="nameplate" id="name-${r}">Waiting for debater ${r.toUpperCase()}</span></section>`).join('')}</div><div class="row controls"><button id="enable-media" onclick="enableMedia()" ${role==='viewer'?'disabled':''}>Enable camera / mic</button><button id="mic-btn" onclick="toggleMic()" ${role==='viewer'?'disabled':''}>Mute mic</button><button id="camera-btn" onclick="toggleCamera()" ${role==='viewer'?'disabled':''}>Camera off</button></div><div class="notice" id="connection-status">Connecting to signaling…</div><div class="pod" style="margin-top:18px"><div class="row between"><h2>Agree on the ground rules</h2><button id="ready-btn" class="primary" onclick="readyUp()">Ready to debate</button></div><div id="proposal" style="margin-top:14px"></div><p class="context" id="room-context"></p><div id="subtopics"></div><p class="foot" id="format"></p><div id="coin" style="margin function updateRoom(){if(!roomJoined||!$('#round-label'))return;let s=state(),active=s.phase==='active',r=s.rounds[s.round];$('#room-title').textContent=room.title;$('#room-context').textContent=room.context;$('#subtopics').innerHTML=room.subs.map((x,i)=>`<div class="subtopic"><b>0${i+1} ${esc(x.title)}</b><p class="muted">${esc(x.context)}</p></div>`).join('');$('#format').textContent=`${room.intro} min introductions each · ${room.framing} min framing each · 2 min opening · 5 min each across topics · 5 min lightning · ${room.closing} min closing each`;for(let side of ['a','b']){let u=s.seats[side];$('#name-'+side).textContent=(u?.alias||'Waiting for opponent')+(side===role?' · You':'');$('#identity-'+side).innerHTML=`${avatar(u)}<p>${esc(u?.alias||'Seat '+side.toUpperCase()+' is open')}</p>`;$('#seat-'+side).classList.toggle('speaking',active&&(r?.speaker===side||r?.speaker==='both'||s.interrupt===side))}$('#round-label').textContent=active?r.label:s.phase==='ended'?'Debate complete':'Waiting room';$('#phase-caption').textContent=active?(r.speaker==='both'?'Open floor':(s.seats[r.speaker]?.alias||'Debater '+r.speaker.toUpperCase())+' has the floor'):s.phase==='ended'?'Recording can now be downloaded':'Review · agree · begin';$('#rounds').innerHTML=s.rounds.map((r,i)=>`<span class="${i<=s.round?'done':''}"></span>`).join('');$('#edit-topic').disabled=role==='viewer'||s.phase!=='lobby';$('#ready-btn').disabled=role==='viewer'||s.phase!=='lobby'||!!s.proposal;$('#ready-btn').textContent=s.ready[role]?'Ready ✓ · click to withdraw':'Ready to debate';$('#proposal').innerHTML=s.proposal?`<div class="notice">${esc(s.seats[s.proposal.by]?.alias||'Opponent')} proposes: <b>${esc(s.proposal.draft.title)}</b><p class="context">${esc(s.proposal.draft.context)}</p>${s.proposal.draft.subs.map(x=>`<p>${esc(x.title)} — ${esc(x.context)}</p>`).join('')}<p>Intro ${s.proposal.draft.intro} · Framing ${s.proposal.draft.framing} · Closing ${s.proposal.draft.closing} · First ${esc(s.propos function proposeEdit(){let s=state();if(role==='viewer'||s.phase!=='lobby')return;const el=modal('Propose topic & format',draftFields(room),(f,el)=>{let draft=parseDraft(f);mutate(s=>{s.proposal={by:role,draft};s.ready={}});el.close();toast('Proposal sent. Your opponent must approve it.')},'Send for approval',{wide:true});wireDebateFields(el)}

function connectPeer(){if(role==='viewer'){$('#connection-status').textContent='Local spectator mode: room chat and timers are available. Video distribution to spectators needs a media server.';return}if(typeof Peer==='undefined'){$('#connection-status').textContent='PeerJS could not load. Local room controls remain available.';return}peer=new Peer('openfloor-'+roomId+'-'+role);peer.on('open',()=>{peerReady=true;$('#connection-status').textContent='Signaling ready. Waiting for opponent. Camera is optional.';if(role==='b'){conn=peer.connect('openfloor-'+roomId+'-a',{reliable:true});wireConnection(conn)}callOpponent()});peer.on('connection',c=>{if(c.peer!=='openfloor-'+roomId+'-'+(role==='a'?'b':'a')){c.close();return}conn=c;wireConnection(c)});peer.on('call',async c=>{if(c.peer!=='openfloor-'+roomId+'-'+(role==='a'?'b':'a')){c.close();return}c.answer(localStream||undefined);wireCall(c)});reconnectTimer=setInterval(()=>{if(role==='b'&&peerReady&&!conn?.open&&!peer.destroyed){conn?.close();conn=peer.connect('openfloor-'+roomId+'-a',{reliable:true});wireConnection(conn)}},5000);peer.on('error',e=>{if($('#connection-status'))$('#connection-status').textContent='Connection: '+e.message+' · Reload after the other debater joins if needed.'});peer.on('disconnected',()=>{if($('#connection-status'))$('#connection-status').textContent='Signaling disconnected. Timers remain local.'})}

/* Pure room rules: shared by UI and tests. Times use server-aligned epoch milliseconds. */
const RoomRules = (() => {
 const debaters = members => members.filter(m=>m.role!=='viewer');
 const modeOf = room => room.mode||'duel';
 function selectTiles(members,activity,previous,room,session,now) {
  let eligible=members.filter(m=>!(m.hidden&&!(session.phase==='active'&&m.role!=='viewer')));
  if(['duel','bot'].includes(modeOf(room))&&session.phase!=='lobby')eligible=eligible.filter(m=>['a','b','bot'].includes(m.role)||m.user_id===room.host);
  const pinned=eligible.filter(m=>m.user_id===room.host||modeOf(room)==='duel'&&m.role==='b'||m.role==='bot');
  const score=m=>{let a=activity[m.user_id]||{};return (a.speaking?100000:0)+(currentRound(session,now)?.speaker===m.user_id?50000:0)+Math.max(0,15000-(now-(a.lastSpoke||0)))+Math.min(a.totalMs||0,120000)/40+(previous.includes(m.user_id)?1500:0)};
  const rest=eligible.filter(m=>!pinned.includes(m)).sort((a,b)=>score(b)-score(a)||a.user_id.localeCompare(b.user_id));
  return [...pinned,...rest].slice(0,8).map(m=>m.user_id);
 }
 function currentRound(session,now){return (session.rounds||[]).find(r=>now>=r.startsAt&&now<r.endsAt)||null}
 // Keep occupied positions stable when a tile is hidden. Vacancies can be filled
 // by another eligible speaker; hiding never reduces the stage's row count.
 function tileSlots(selected,previous,memberCount){
  const size=Math.min(8,Math.max(selected.length,previous.length,memberCount?1:0));
  const slots=Array.from({length:size},(_,i)=>selected.includes(previous[i])?previous[i]:null);
  for(const id of selected)if(!slots.includes(id))slots[slots.indexOf(null)]=id;
  return slots;
 }

 function validateFormat(room){if(modeOf(room)==='bot'&&((room.subs||[]).length||![1,2].includes(room.botMinutes||1)||!['Beginner','Watcher','Regular','Experienced','Professional'].includes(room.botDifficulty||'Beginner')))throw Error('Bot practice uses a topic and context, 1 or 2 minute turns, and a listed difficulty.');if(!['duel','open','teams','bot'].includes(modeOf(room)))throw Error('Unknown debate format');if((room.subs||[]).length>(modeOf(room)==='open'?3:5))throw Error(modeOf(room)==='open'?'Open debates allow zero to three subtopics.':'Use no more than five subtopics.')}

})();

function safeFact(value){
 if(!value||typeof value.text!=='string'||!value.text.trim()||value.text.length>600)return null;
 try{const url=new URL(value.url);if(url.origin!=='https://en.wikipedia.org'||url.username||url.password||!url.pathname.startsWith('/wiki/'))return null;

}
function wikipediaDailyFact(data,date=new Date()){
 const events=Array.isArray(data?.events)?data.events.filter(e=>Number.isInteger(e.year)&&e.year>=-5000&&e.year<=date.getUTCFullYear()&&typeof e.text==='string'&&e.text.trim()&&e.text.length<=550):[];
 const preferred=events.filter(e=>/discover|invent|spacecraft|telescope|astronom|circumnavig|museum|patent|railway|science|computer|music|planet|opera|publish|radio|television/i.test(e.text)&&!/killed|crash|massacre|war|murder|attack|death|died|bomb/i.test(e.text));const pool=preferred.length?preferred:events;const event=pool[Math.floor(Math.random()*pool.length)];
 if(!event)return null;
 const month=['January','February','March','April','May','June','July','August','September','October','November','December'][date.getUTCMonth()];
 return safeFact({text:'On this day in '+(event.year<0?Math.abs(event.year)+' BC':event.year)+': '+event.text,url:'https://en.wikipedia.org/wiki/'+month+'_'+date.getUTCDate()});
}
async function dailyWaitingFact(){
 const day=new Date().toISOString().slice(0,10);
 if(waitingFactDate===day&&(waitingFactCached||waitingFactRequest))return waitingFactCached||waitingFactRequest;
 waitingFactDate=day;waitingFactCached=null;
 try{const saved=JSON.parse(localStorage.getItem(waitingFactKey)||'null');if(saved?.day===day&&safeFact(saved.fact))return waitingFactCached=safeFact(saved.fact)}catch{}
 const job=(async()=>{
  const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),4000);
  try{
   const response=await fetch('https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/'+day.slice(5,7)+'/'+day.slice(8,10),{headers:{Accept:'application/json'},credentials:'omit',referrerPolicy:'no-referrer',signal:abort.signal});
   if(!response.ok)throw Error('Fact unavailable');
   const fact=wikipediaDailyFact(await response.json(),new Date(day+'T00:00:00Z'));if(!fact)return null;
   if(waitingFactDate===day)waitingFactCached=fact;
   try{localStorage.setItem(waitingFactKey,JSON.stringify({day,fact}))}catch{}
   return fact;
  }catch{return null}finally{clearTimeout(timeout)}
 })();
 // Keep the settled promise for this day so a failing provider is not polled repeatedly.
 waitingFactRequest=job;return job;
}

function cloudAuthOptions(){
 // Upgrade tab-only sessions once. Never resurrect an old tab after shared sign-out.
 const marker=CLOUD_AUTH_KEY+'.shared-v1';
 if(!localStorage.getItem(marker)){
  const legacy=sessionStorage.getItem(CLOUD_AUTH_KEY);
  if(!localStorage.getItem(CLOUD_AUTH_KEY)&&legacy){try{const parsed=JSON.parse(legacy);if(typeof parsed.access_token==='string'&&typeof parsed.refresh_token==='string'&&parsed.user?.id)localStorage.setItem(CLOUD_AUTH_KEY,legacy)}catch{}}
  localStorage.setItem(marker,'1');
 }
 sessionStorage.removeItem(CLOUD_AUTH_KEY);
 return {storage:localStorage,storageKey:CLOUD_AUTH_KEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true};
}
async function cloudAuthChanged(event,session){

 if(generation!==cloudGeneration)return;

async function cloudSchedule(id){if(!cloudSignedIn())return;try{let exists=read().subscriptions.some(s=>s.user===me().id&&s.id===id);await cloudResult(exists?cloudClient.from('subscriptions').delete().eq('user_id',me().id).eq('debate_id',id):cloudClient.from('subscriptions').insert({user_id:me().id,debate_id:id}));await cloudRefresh();toast(exists?'Removed from your schedule':'Added to your shared schedule')}catch(e){toast(cloudError(e))}}
async function cloudSendChat(e){e.preventDefault();if(!cloudSignedIn())return;const text=e.target.message.value.trim();if(!text)return;const button=e.target.querySelector('button');button.disabled=true;try{const recipient=channel==='lobby'?null:channel.split(':').find(id=>id!==me().id);await cloudResult(cloudClient.from('messages').insert({sender:me().id,recipient,body:text}));e.target.reset();await cloudMessages()}catch(err){toast('Message was not sent: '+cloudError(err))}finally{button.disabled=false}}
async function cloudLoadRoom(password=''){if(!roomId||!/^[0-9a-f-]{36}$/i.test(roomId)){$('#app').innerHTML='<div class="empty"><h1>Room not found</h1><p>Local sample links do not identify shared debates.</p><a href="index.html">Back to dashboard</a></div>';return}try{const row=await cloudResult(cloudClient.rpc('open_debate',{p_id:roomId,p_password:password}));const d=cloudDebate(row);edit(db=>{db.debates=db.debates.filter(x=>x.id!==d.id);db.debates.push(d)});initRoom()}catch(e){$('#app').innerHTML=`<div class="pod" style="max-width:550px;margin:50px auto"><h1>Enter this room</h1><p class="context">${esc(cloudError(e))}</p>${cloudSession?'<form id="unlock-room"><label>Room password<input name="password" type="password" maxlength="200"></label><button class="primary" style="margin-top:16px">Unlock / retry</button></form>':'<button onclick="auth(false)">Sign in</button>'}<p class="foot"><a href="index.html">← Dashboard</a></p></div>`;if($('#unlock-room'))$('#unlock-room').onsubmit=e=>{e.preventDefault();cloudLoadRoom(e.target.password.value)}}}
const originalJoinRoom=joinRoom,originalCleanup=cleanup;
async function cloudJoinRoom(e){e.preventDefault();if(!cloudSignedIn())return;const f=new FormData(e.target);if(!f.has('consent'))return $('#entry-error').textContent='Acknowledge the recording notice to enter.';try{
 await cloudResult(cloudClient.rpc('enter_room',{p_id:roomId,p_role:f.get('role'),p_tab:tabId}));
 e.target.alias.value=me().alias;await originalJoinRoom(e);
 if(!roomJoined){await cloudClient.rpc('leave_room',{p_tab:tabId});return}
 await cloudRoomRoster();cloudRoomHeartbeat=setInterval(async()=>{try{const alive=await cloudResult(cloudClient.rpc('heartbeat_room',{p_tab:tabId}));if(!alive)throw Error('Room reservation expired. Leave and rejoin.');await cloudRoomRoster()}catch(err){cloudBanner('Room connection lost: '+cloudError(err),true);stopRecording();cloudCleanup();cloudBanner('Room reservation could not be renewed. Media stopped. Save your recording, leave, and rejoin. '+cloudError(err),true)}},10000);
 }catch(err){$('#entry-error').textContent=cloudError(err)}}
async function cloudRoomRoster(){if(!roomJoined)return;const [members,proposal]=await Promise.all([cloudResult(cloudClient.from('room_members').select('user_id,role,expires_at').eq('debate_id',roomId)),cloudResult(cloudClient.from('topic_proposals').select('*').eq('debate_id',roomId))]);let s=state();const seats={};for(let m of members.filter(m=>m.role!=='viewer')){let p=read().users.find(p=>p.id===m.user_id);if(!p){p=await cloudResult(cloudClient.from('profiles').select('*').eq('id',m.user_id).single());edit(d=>d.users.push(p))}seats[m.role]={id:m.user_id,alias:p.alias,avatar:p.avatar,until:new Date(m.expires_at).getTime()}}s.seats=seats;if(proposal.length){const proposer=members.find(m=>m.user_id===proposal[0].proposer);s.proposal={by:proposer?.role||'opponent',draft:proposal[0].draft}}else s.proposal=null;put(roomKey,s);updateRoom()}
function cloudCleanup(){clearInterval(cloudRoomHeartbeat);cloudRoomHeartbeat=null;if(cloudClient&&roomJoined)cloudClient.rpc('leave_room',{p_tab:tabId}).then(()=>{}).catch(()=>{});originalCleanup()}
function cloudProposeEdit(){if(role==='viewer'||state().phase!=='lobby')return;const el=modal('Propose topic & format',draftFields(room),async(f,el)=>{let draft=parseDraft(f);await cloudResult(cloudClient.rpc('propose_topic',{p_id:roomId,p_draft:draft}));mutate(s=>{s.proposal={by:role,draft};s.ready={}});el.close();toast('Proposal saved. Your opponent must approve it.')},'Send for approval',{wide:true});wireDebateFields(el)}
async function cloudApproveEdit(yes){if(role==='viewer'||state().phase!=='lobby')return;try{await cloudResult(cloudClient.rpc('approve_topic',{p_id:roomId,p_approve:yes}));const row=await cloudResult(cloudClient.from('debates').select('*').eq('id',roomId).single());room=cloudDebate(row);edit(d=>{d.debates=d.debates.filter(x=>x.id!==roomId);d.debates.push(room)});mutate(s=>{s.proposal=null;s.ready={}});conn?.send({type:'room',room})}catch(e){toast(cloudError(e))}}
function confirmationCallback(href){const url=new URL(href),hash=new URLSearchParams(url.hash.slice(1));return {signup:(hash.get('type')||url.searchParams.get('type'))==='signup',error:hash.has('error')||url.searchParams.has('error'),hasToken:hash.has('access_token')}}
function confirmationNotice(message,error=false){let el=$('#email-confirmation-status');if(!el){el=document.createElement('div');el.id='email-confirmation-status';el.className='notice';el.style.margin='12px 4%';document.querySelector('header').after(el)}el.setAttribute('role',error?'alert':'status');el.setAttribute('aria-live','polite');el.textContent=message;el.style.borderColor=error?'#784343':'#8ba64d'}
async function showEmailConfirmation(callback,session,sessionError){if(isRoom)return;if(callback.error){confirmationNotice('This email link is invalid or has expired. Request a new verification email, or sign in if you already confirmed your email.',true);return}if(!callback.signup)return;if(sessionError||!session||!callback.hasToken){confirmationNotice('We could not confirm this email link. Try signing in, or request a new verification email.',true);return}try{const {data,error}=await cloudClient.auth.getUser();if(error||!data?.user?.email_confirmed_at)throw Error('Unconfirmed');confirmationNotice('Your email was successfully verified. You are now signed in.')}catch{confirmationNotice('We could not verify your email status. Please try signing in again.',true)}}
async function initCloud(){if(!CLOUD_ENABLED)return;cloudStarting=true;sessionStorage.removeItem('openfloor.user');auth=cloudAuth;signout=cloudSignout;requireUser=cloudSignedIn;settings=cloudSettings;adminPanel=cloudAdmin;createDebate=cloudCreateDebate;schedule=cloudSchedule;sendChat=cloudSendChat;joinRoom=cloudJoinRoom;cleanup=cloudCleanup;proposeEdit=cloudProposeEdit;approveEdit=cloudApproveEdit;importRooms=()=>toast('Local imports are not uploaded automatically. Create a shared debate to publish it.');const originalOpenDM=openDM;openDM=id=>{const opened=originalOpenDM(id);if(opened)cloudMessages();return opened};if(typeof installRoomV2==='function')installRoomV2();header();$('#app').innerHTML='<section class="startup-loading" role="status" aria-live="polite"><h2>Opening Openfloor…</h2><p class="muted">Restoring your session and loading your page.</p></section>';cloudBanner('Connecting to OpenFloor…');
 if(!window.supabase){cloudBanner('Unable to connect. Check your internet connection and reload.',true);cloudStartupError();return}
 const emailCallback=confirmationCallback(location.href);
 cloudClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:cloudAuthOptions()});
 const {data,error}=await cloudClient.auth.getSession();await showEmailConfirmation(emailCallback,data?.session,error);if(error)throw error;await cloudAcceptSession(data?.session||null);
 cloudClient.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{cloudAuthChanged(event,session).catch(e=>cloudBanner(cloudError(e),true))},0)});
 setInterval(()=>{if(!isRoom){const d=read().debates.find(d=>d.privacy==='public'&&d.start<=Date.now());updateFeaturedClock()}},1000);
 setInterval(()=>{if(!document.hidden){cloudRefresh();if(!isRoom&&cloudReady)checkReminders()}},15000);
}
if(CLOUD_ENABLED)initCloud().catch(e=>{cloudBanner(cloudError(e),true);cloudStartupError()});

function cloudChangePassword(){if(!cloudSignedIn())return;modal('Change password','<label>Current password<input name="current" type="password" required autocomplete="current-password"></label><label>New password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm new password<input name="confirm" type="password" minlength="8" required autocomplete="new-password"></label>',async(f,el)=>{if(f.get('password')!==f.get('confirm'))throw Error('Passwords do not match.');if(!f.get('current'))throw Error('Enter your current password.');const owner=cloudSession.user.id;const verifier=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await verifier.auth.signInWithPassword({email:cloudSession.user.email,password:f.get('current')});if(error||data?.user?.id!==owner)throw Error('Current password is incorrect.');try{if(cloudSession?.user.id!==owner)throw Error('Account changed. Sign in and try again.');await cloudResult(cloudClient.auth.updateUser({password:f.get('password'),current_password:f.get('current')}))}finally{await verifier.auth.signOut({scope:'local'}).catch(()=>{})}el.close();toast('Password changed. Use the new password next time you sign in.')},'Change password')}

function cloudStartupError(){if(!cloudStarting)return;$('#app').innerHTML='<section class="startup-loading" role="alert"><h2>Could not finish loading</h2><p class="muted">Your sign-in status could not be loaded. Please try again.</p><button onclick="location.reload()">Reload page</button></section>'}
</script></body></html>
